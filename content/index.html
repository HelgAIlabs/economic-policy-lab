<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif}.serif{font-family:'Playfair Display',Georgia,serif}.article-body p{margin:1.1em 0}.article-body h2{font:700 1.7rem 'Playfair Display',Georgia,serif;margin:1.5em 0 .6em}.article-body h3{font:700 1.3rem 'Playfair Display',Georgia,serif;margin:1.4em 0 .5em}.article-body a{color:#af2b3e;text-decoration:underline}.article-body img{max-width:100%;height:auto;margin:1.5rem 0}.article-body blockquote{border-left:3px solid #af2b3e;padding-left:1rem;color:#555;font-style:italic}</style></head><body class="bg-[#fbf9f8] text-[#1b1c1c]"><header class="border-b-2 border-gray-300"><div class="max-w-7xl mx-auto px-5 md:px-12 py-5"><div class="flex justify-between items-center"><a href="/" class="serif text-3xl md:text-5xl font-bold tracking-tight">Economic Policy Lab</a><a href="/login" class="bg-black text-white px-5 py-3 text-xs uppercase tracking-wider">Log in</a></div><nav class="flex flex-wrap justify-center gap-7 mt-5 text-xs uppercase tracking-wider"><a href="/">Home</a><a href="/research">Research</a><a href="/articles">Articles</a><a href="/team">Team</a><a href="/join">Join Us</a></nav></div></header><main class="max-w-4xl mx-auto px-5 md:px-12 py-12 md:py-20"><a id="back" class="text-xs uppercase tracking-[.18em] text-[#af2b3e]" href="/articles">← Back</a><div id="root" class="mt-8">Loading…</div></main><script type="module">import{supabase}from'../supabase-client.js';const root=document.querySelector('#root'),id=new URLSearchParams(location.search).get('id'),back=document.querySelector('#back');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));if(!id){root.innerHTML='<p class="text-red-700">Content not found.</p>'}else{const{data:a,error}=await supabase.from('articles').select('title,excerpt,category,author_name,cover_image_url,content,content_type,published_at,status').eq('id',id).eq('status','published').single();if(error||!a){root.innerHTML='<p class="text-red-700">This content is not available.</p>'}else{back.href=a.content_type==='research'?'/research':'/articles';back.textContent=a.content_type==='research'?'← Back to Research':'← Back to Articles';document.title=a.title+' — Economic Policy Lab';root.innerHTML=`<p class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">${a.content_type==='research'?'Research':'Article'}${a.category?' · '+esc(a.category):''}</p><h1 class="serif text-4xl md:text-6xl font-bold mt-4 leading-tight">${esc(a.title)}</h1><p class="text-gray-600 mt-4">${esc(a.author_name||'EPL Member')}${a.published_at?' · '+new Date(a.published_at).toLocaleDateString():''}</p>${a.cover_image_url?`<img src="${esc(a.cover_image_url)}" alt="" class="w-full max-h-[520px] object-cover mt-8 border">`:''}<p class="text-xl leading-8 text-gray-700 mt-8">${esc(a.excerpt||'')}</p><article class="article-body text-lg leading-8 mt-8">${a.content||''}</article>`}}}</script></body></html>
