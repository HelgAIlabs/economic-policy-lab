<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-[#fbf9f8] text-[#1b1c1c]"><main class="min-h-screen flex items-center justify-center px-5 py-12"><section class="w-full max-w-md bg-white border border-[#e0e0e0] p-8"><a href="/" class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">Economic Policy Lab</a><h1 class="font-serif text-4xl font-bold mt-5 mb-2">Log in</h1><p class="text-gray-600 mb-7">Members and administrators use the same secure login; your role opens the correct workspace.</p><div id="message" class="hidden mb-4 p-3 text-sm border"></div><form id="form" class="space-y-4"><label class="block text-sm font-semibold">Email<input id="email" type="email" autocomplete="username" required class="mt-1 w-full border p-3"></label><label class="block text-sm font-semibold">Password<input id="password" type="password" autocomplete="current-password" required class="mt-1 w-full border p-3"></label><button id="submit" class="w-full bg-black text-white py-3 uppercase tracking-wider text-sm font-semibold">Log in</button></form><button id="reset" class="w-full border py-3 text-sm mt-4">Reset password</button><div class="mt-6 grid grid-cols-2 gap-2 text-xs"><div class="border p-3"><strong>Member</strong><br><span class="text-gray-500">Submit Articles & Research</span></div><div class="border p-3"><strong>Admin</strong><br><span class="text-gray-500">Review & edit content</span></div></div><p class="text-xs text-gray-500 mt-5">Account creation is managed by EPL. Public sign-up is disabled.</p><a href="/" class="block text-center text-sm mt-7 underline">Back to EPL</a></section></main><script type="module">import{supabase}from'../supabase-client.js';const $=s=>document.querySelector(s),form=$('#form'),msg=$('#message');function show(t,ok=false){msg.textContent=t;msg.className='mb-4 p-3 text-sm border '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50')}async function destination(){const{data:{session}}=await supabase.auth.getSession();if(!session)return null;const{data:p,error}=await supabase.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(!error&&p?.role==='admin')return'/admin';if(!error&&p?.role==='member')return'/member';const{data:isAdmin}=await supabase.rpc('is_admin');return isAdmin===true?'/admin':'/member'}const d=await destination();if(d)location.replace(d);form.onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;$('#submit').textContent='Logging in…';await supabase.auth.signOut();const{error}=await supabase.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#submit').disabled=false;$('#submit').textContent='Log in';return show(error.message)}const next=await destination();location.replace(next||'/member')};$('#reset').onclick=async()=>{const email=$('#email').value.trim();if(!email)return show('Enter your email first.');const{error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login/'});if(error)return show(error.message);show('Password reset email sent.',true)};</script></body></html>
