<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team & Leadership - Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;padding:0;overflow-x:hidden}body{font-family:Inter,sans-serif;background:#fbf9f8;color:#1b1c1c}.serif{font-family:'Playfair Display',Georgia,serif}.label{font-size:12px;line-height:1;letter-spacing:.05em;font-weight:600}.caption{font-size:14px;line-height:1.4}.body-lg{font-size:18px;line-height:1.6}.nav{border-top:2px solid #b8b8b8;border-bottom:2px solid #b8b8b8}.card{border:1px solid #c4c7c7}.grayscale{filter:grayscale(1)}.member-name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.member-name{min-width:0;flex:1 1 180px}.team-social-links{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-top:2px}.team-social-links a{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid #c4c7c7;transition:background-color .2s,color .2s}.team-social-links a:hover{background:#000;color:#fff}@media(max-width:767px){.nav{overflow-x:auto;justify-content:flex-start!important}.site-pad{padding-left:20px!important;padding-right:20px!important}}</style></head><body><header><div class="site-pad px-12 py-4"><div class="h-[53px] flex items-center justify-between"><button class="md:hidden" aria-label="Menu"><span class="text-2xl">☰</span></button><a href="/" class="serif text-4xl md:text-5xl font-bold uppercase tracking-tighter mx-auto">Economic Policy Lab</a><div class="flex items-center gap-4"><a class="hidden md:inline-flex bg-black text-white label uppercase tracking-wider px-6 py-3" href="/login/">Log in</a></div></div><nav class="nav flex items-center justify-center gap-8 w-screen relative left-1/2 -translate-x-1/2 py-3 px-2 whitespace-nowrap"><a class="label uppercase tracking-wider px-3 py-2" href="/">Home</a><a class="label uppercase tracking-wider px-3 py-2" href="/research">Research</a><a class="label uppercase tracking-wider px-3 py-2" href="/articles">Articles</a><a class="label uppercase tracking-wider text-[#af2b3e] border-b-2 border-[#af2b3e] px-3 py-2" href="/team">Team</a><a class="label uppercase tracking-wider px-3 py-2" href="/join">Join Us</a></nav></div></header><main class="max-w-7xl mx-auto px-5 md:px-12 py-10 md:py-20"><section class="mb-16 text-center max-w-3xl mx-auto"><h1 class="serif text-5xl md:text-6xl font-bold mb-5">Leadership & Scholars</h1><div class="h-px w-24 bg-[#c4c7c7] mx-auto mb-5"></div><p class="body-lg text-[#444748]">The Economic Policy Lab is driven by a multidisciplinary team of economists, researchers, and public policy experts dedicated to rigorous analysis and actionable insights.</p></section><section class="mb-20"><div class="flex items-center justify-between mb-6"><h2 class="label uppercase tracking-[.15em]">Founder & Board of Directors</h2></div><div id="board" class="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch"></div></section><section><div class="flex items-center justify-between mb-6"><h2 class="label uppercase tracking-[.15em]">Members</h2></div><div id="members" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div></section></main><script type="module">import{supabase}from'../supabase-client.js';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const safe=s=>{try{const u=new URL(String(s??'').trim());return u.protocol==='https:'?u.toString():null}catch{return null}};function img(url,cls){return url?`<img src="${esc(url)}" class="${cls} w-full object-cover grayscale" alt="">`:'<div class="w-full h-full min-h-64 bg-[#efeded] flex items-center justify-center text-xs uppercase tracking-wider text-[#747878]">No photo</div>'}function socialLinks(p){const linkedin=safe(p.linkedin_url),instagram=safe(p.instagram_url);if(!linkedin&&!instagram)return '';return `<div class="team-social-links" aria-label="${esc(p.name)} social links">${linkedin?`<a href="${esc(linkedin)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(p.name)} on LinkedIn" title="LinkedIn"><span class="font-bold text-xs">in</span></a>`:''}${instagram?`<a href="${esc(instagram)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(p.name)} on Instagram" title="Instagram"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/></svg></a>`:''}</div>`}function boardCard(p){return `<article class="card bg-[#f5f3f3] p-6 md:p-8 flex flex-col md:flex-row gap-8 h-full"><div class="w-full md:w-1/2 flex-shrink-0">${img(p.image_url,'h-[400px]')}</div><div class="w-full md:w-1/2 flex flex-col justify-center"><h3 class="serif text-4xl md:text-5xl font-bold">${esc(p.name)}</h3><p class="label uppercase tracking-wider text-[#af2b3e] mt-3">${esc(p.role_title)}</p><div class="h-px w-full bg-[#c4c7c7] my-6"></div><p class="text-xl leading-8 text-[#444748]">${esc(p.bio)}</p></div></article>`}function memberCard(p){return `<article class="border-b border-[#c4c7c7] pb-5 group"><div class="overflow-hidden mb-5">${img(p.image_url,'h-80 group-hover:scale-105 transition-transform duration-500')}</div><div class="member-name-row"><h3 class="serif text-2xl font-bold member-name">${esc(p.name)}</h3>${socialLinks(p)}</div><p class="label uppercase tracking-wider text-[#af2b3e] mt-2">${esc(p.role_title)}</p>${p.bio?`<p class="caption text-[#444748] mt-3">${esc(p.bio)}</p>`:''}</article>`}async function load(){const{data,error}=await supabase.from('team_members').select('id,name,role_title,bio,image_url,section,sort_order,linkedin_url,instagram_url').eq('is_active',true).order('section').order('sort_order').order('created_at');if(error){document.querySelector('#board').innerHTML=`<div class="md:col-span-12 card p-8 text-[#af2b3e]">Unable to load the team directory.</div>`;return}const board=(data||[]).filter(x=>x.section==='board');const members=(data||[]).filter(x=>x.section==='member');document.querySelector('#board').innerHTML=board.map(boardCard).join('')||'<div class="md:col-span-12 text-gray-500">No board profiles published.</div>';document.querySelector('#members').innerHTML=members.map(memberCard).join('')||'<div class="md:col-span-3 text-gray-500">No members published.</div>'}load();</script><script type="module" src="/team/team-socials.js"></script></body></html>
