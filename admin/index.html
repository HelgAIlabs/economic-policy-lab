<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script><style>.article-body p{margin:1em 0}.article-body a{color:#af2b3e;text-decoration:underline}.article-body img{max-width:100%;height:auto}</style></head>
<body class="bg-[#fbf9f8] text-[#1b1c1c]"><main class="max-w-7xl mx-auto px-5 md:px-10 py-10"><header class="flex flex-col md:flex-row md:justify-between gap-5 items-start border-b pb-7"><div><a href="/" class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">Economic Policy Lab</a><p class="text-xs uppercase tracking-[.18em] text-[#af2b3e] mt-5">Editorial administration</p><h1 class="font-serif text-4xl md:text-5xl font-bold mt-2">Admin dashboard</h1><p id="identity" class="text-gray-600 mt-2"></p></div><div class="flex gap-3"><a href="/articles" class="border px-4 py-2 text-sm">Public articles</a><button id="logout" class="border px-4 py-2 text-sm">Log out</button></div></header>
<nav class="flex flex-wrap gap-2 py-6 border-b"><button data-filter="all" class="tab bg-black text-white px-4 py-2 text-sm">All</button><button data-filter="pending" class="tab border px-4 py-2 text-sm">Needs review</button><button data-filter="published" class="tab border px-4 py-2 text-sm">Published</button><button data-filter="archived" class="tab border px-4 py-2 text-sm">Archived</button><button data-filter="rejected" class="tab border px-4 py-2 text-sm">Rejected</button></nav>
<section class="py-8"><div id="message" class="hidden mb-5 p-4 border"></div><div id="list" class="space-y-4"><p class="text-gray-500">Loading…</p></div></section></main>
<script type="module">import {supabase} from '../supabase-client.js';const $=s=>document.querySelector(s),list=$('#list'),msg=$('#message');let articles=[],filter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function show(t,ok=false){msg.textContent=t;msg.className='mb-5 p-4 border '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50');}
const {data:{session}}=await supabase.auth.getSession();if(!session)location.href='/auth/';const {data:profile}=await supabase.from('profiles').select('role,display_name').eq('id',session.user.id).single();if(profile?.role!=='admin')location.href='/member';$('#identity').textContent=profile.display_name||session.user.email;$('#logout').onclick=async()=>{await supabase.auth.signOut();location.href='/auth/'};
async function load(){const {data,error}=await supabase.from('articles').select('*').order('updated_at',{ascending:false});if(error){list.innerHTML='<p class="p-5 border text-red-700">'+esc(error.message)+'</p>';return}articles=data||[];render();}function render(){const rows=articles.filter(a=>filter==='all'||a.status===filter);if(!rows.length){list.innerHTML='<div class="bg-white border p-10 text-center text-gray-500">No articles in this section.</div>';return}list.innerHTML=rows.map(a=>`<article class="bg-white border p-5 md:p-6"><div class="flex flex-col lg:flex-row justify-between gap-5"><div class="min-w-0"><div class="flex flex-wrap gap-2 items-center"><span class="text-xs uppercase tracking-wider border px-2 py-1">${esc(a.status)}</span>${a.category?`<span class="text-xs text-gray-500">${esc(a.category)}</span>`:''}</div><h2 class="font-serif text-2xl font-bold mt-3">${esc(a.title)}</h2><p class="text-sm text-gray-600 mt-1">By ${esc(a.author_name||'EPL Member')} · ${new Date(a.updated_at||a.created_at).toLocaleString()}</p>${a.excerpt?`<p class="text-sm mt-3 text-gray-700 max-w-3xl">${esc(a.excerpt)}</p>`:''}</div><div class="flex flex-wrap gap-2 lg:justify-end lg:max-w-sm">${a.status==='pending'?`<button data-action="approve" data-id="${a.id}" class="bg-black text-white px-4 py-2 text-sm">Approve & publish</button><button data-action="reject" data-id="${a.id}" class="border px-4 py-2 text-sm">Reject</button>`:''}${a.status==='published'?`<button data-action="archive" data-id="${a.id}" class="border px-4 py-2 text-sm">Archive / hide</button>`:''}${a.status==='archived'||a.status==='rejected'?`<button data-action="restore" data-id="${a.id}" class="border px-4 py-2 text-sm">Restore to draft</button>`:''}<a href="/admin/edit?id=${encodeURIComponent(a.id)}" class="border px-4 py-2 text-sm">Edit</a><button data-action="delete" data-id="${a.id}" class="border border-[#af2b3e] text-[#af2b3e] px-4 py-2 text-sm">Delete</button></div></div></article>`).join('');}
async function act(action,id){let update={};if(action==='approve')update={status:'published',published_at:new Date().toISOString()};if(action==='reject')update={status:'rejected',published_at:null};if(action==='archive')update={status:'archived'};if(action==='restore')update={status:'draft',published_at:null};if(action==='delete'){if(!confirm('Delete this article permanently? This cannot be undone.'))return;const {error}=await supabase.from('articles').delete().eq('id',id);if(error)return show(error.message);show('Article deleted.',true);return load();}const {error}=await supabase.from('articles').update(update).eq('id',id);if(error)return show(error.message);show(action==='approve'?'Article published.':'Article updated.',true);load();}
list.onclick=e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.action,b.dataset.id)};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');render()});load();</script></body></html>
