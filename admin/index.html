<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editorial Admin — Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif}.serif{font-family:'Playfair Display',Georgia,serif}.pill{font-size:10px;letter-spacing:.12em;text-transform:uppercase}th{font-size:10px;letter-spacing:.12em;text-transform:uppercase}.row:hover{background:#fcfbfa}</style></head>
<body class="bg-[#fbf9f8] text-[#1b1c1c]"><main class="max-w-[1500px] mx-auto px-5 md:px-10 py-8 md:py-12">
<header class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6 border-b pb-7"><div><a href="/" class="text-xs uppercase tracking-[.2em] text-[#af2b3e]">Economic Policy Lab</a><p class="text-xs uppercase tracking-[.2em] text-[#af2b3e] mt-5">Editorial administration</p><h1 class="serif text-4xl md:text-5xl font-bold mt-2">Content review</h1><p id="identity" class="text-gray-600 mt-2"></p></div><div class="flex flex-wrap gap-3"><a href="/articles" class="border px-4 py-2 text-sm">View public site</a><button id="logout" class="border px-4 py-2 text-sm">Log out</button></div></header>
<section class="py-6 border-b"><div class="grid md:grid-cols-4 gap-3" id="stats"><div class="bg-white border p-4"><div class="text-xs uppercase tracking-wider text-gray-500">Total</div><div id="s-total" class="serif text-3xl font-bold mt-1">—</div></div><div class="bg-white border p-4"><div class="text-xs uppercase tracking-wider text-gray-500">Needs review</div><div id="s-pending" class="serif text-3xl font-bold mt-1">—</div></div><div class="bg-white border p-4"><div class="text-xs uppercase tracking-wider text-gray-500">Published</div><div id="s-published" class="serif text-3xl font-bold mt-1">—</div></div><div class="bg-white border p-4"><div class="text-xs uppercase tracking-wider text-gray-500">Archived</div><div id="s-archived" class="serif text-3xl font-bold mt-1">—</div></div></div></section>
<section class="py-5 border-b"><div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4"><div><h2 class="serif text-2xl font-bold">Editorial queue</h2><p class="text-sm text-gray-600 mt-1">Admins review and edit submissions; new content is created by members only.</p></div><div class="flex gap-2"><input id="search" class="border bg-white px-3 py-2 text-sm w-72" placeholder="Search title, author, category…"><select id="sort" class="border bg-white px-3 py-2 text-sm"><option value="updated">Recently updated</option><option value="title">Title A–Z</option></select></div></div><div class="flex flex-wrap gap-2 mt-4" id="type-tabs"><button data-type="all" class="type-tab bg-black text-white px-4 py-2 text-xs uppercase tracking-wider">All</button><button data-type="article" class="type-tab border px-4 py-2 text-xs uppercase tracking-wider">Articles</button><button data-type="research" class="type-tab border px-4 py-2 text-xs uppercase tracking-wider">Research</button></div><div class="flex flex-wrap gap-2 mt-3" id="status-tabs"><button data-status="all" class="status-tab bg-black text-white px-3 py-2 text-xs uppercase tracking-wider">All statuses</button><button data-status="pending" class="status-tab border px-3 py-2 text-xs uppercase tracking-wider">Needs review</button><button data-status="published" class="status-tab border px-3 py-2 text-xs uppercase tracking-wider">Published</button><button data-status="draft" class="status-tab border px-3 py-2 text-xs uppercase tracking-wider">Drafts</button><button data-status="archived" class="status-tab border px-3 py-2 text-xs uppercase tracking-wider">Archived</button><button data-status="rejected" class="status-tab border px-3 py-2 text-xs uppercase tracking-wider">Rejected</button></div></section>
<div id="message" class="hidden mt-5 p-4 border"></div>
<section class="mt-6 bg-white border overflow-x-auto"><table class="w-full min-w-[1180px] border-collapse"><thead class="bg-[#f5f3f2] border-b"><tr><th class="text-left p-4">Type</th><th class="text-left p-4">Title</th><th class="text-left p-4">Author</th><th class="text-left p-4">Category</th><th class="text-left p-4">Status</th><th class="text-left p-4">Updated</th><th class="text-right p-4">Actions</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="p-10 text-gray-500">Loading…</td></tr></tbody></table></section>
</main><script type="module">import{supabase}from'../supabase-client.js';const $=s=>document.querySelector(s),rows=$('#rows'),msg=$('#message');let items=[],typeFilter='all',statusFilter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function show(t,ok=false){msg.textContent=t;msg.className='mt-5 p-4 border '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50')}const{data:{session}}=await supabase.auth.getSession();if(!session)location.href='/login/';const{data:profile}=await supabase.from('profiles').select('role,display_name').eq('id',session.user.id).single();if(profile?.role!=='admin'){location.href='/member';throw new Error('not admin')}$('#identity').textContent=profile.display_name||session.user.email;$('#logout').onclick=async()=>{await supabase.auth.signOut();location.href='/login/'};function updateStats(){for(const s of ['total','pending','published','archived'])$('#s-'+s).textContent=s==='total'?items.length:items.filter(x=>x.status===s).length}function filtered(){const q=$('#search').value.trim().toLowerCase();let list=items.filter(a=>(typeFilter==='all'||(a.content_type||'article')===typeFilter)&&(statusFilter==='all'||a.status===statusFilter)&&(!q||[a.title,a.author_name,a.category,a.content_type,a.status].some(v=>String(v||'').toLowerCase().includes(q))));return list.sort((a,b)=>$('#sort').value==='title'?String(a.title||'').localeCompare(String(b.title||'')):new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at))}function render(){const list=filtered();if(!list.length){rows.innerHTML='<tr><td colspan="7" class="p-12 text-center text-gray-500">No content matches these filters.</td></tr>';return}rows.innerHTML=list.map(a=>{const research=a.content_type==='research';const status=a.status;const badge=status==='pending'?'bg-amber-50 text-amber-800 border-amber-200':status==='published'?'bg-green-50 text-green-800 border-green-200':status==='rejected'?'bg-red-50 text-red-800 border-red-200':status==='archived'?'bg-gray-100 text-gray-700 border-gray-300':'bg-white text-gray-700 border-gray-300';const typeClass=research?'text-[#af2b3e]':'text-gray-700';return `<tr class="row border-b last:border-b-0"><td class="p-4 align-top"><span class="pill border px-2 py-1 ${typeClass}">${research?'Research':'Article'}</span></td><td class="p-4 align-top"><a href="/admin/edit?id=${encodeURIComponent(a.id)}" class="serif text-lg font-bold hover:text-[#af2b3e]">${esc(a.title||'Untitled')}</a></td><td class="p-4 align-top text-sm">${esc(a.author_name||'EPL Member')}</td><td class="p-4 align-top text-sm text-gray-600">${esc(a.category||'—')}</td><td class="p-4 align-top"><span class="pill border px-2 py-1 ${badge}">${esc(status)}</span></td><td class="p-4 align-top text-sm text-gray-600 whitespace-nowrap">${new Date(a.updated_at||a.created_at).toLocaleDateString()}</td><td class="p-4 align-top"><div class="flex flex-wrap justify-end gap-2">${status==='pending'?`<button data-action="approve" data-id="${a.id}" class="bg-black text-white px-3 py-2 text-xs">Approve & publish</button><button data-action="reject" data-id="${a.id}" class="border px-3 py-2 text-xs">Reject</button>`:''}${status==='published'?`<button data-action="archive" data-id="${a.id}" class="border px-3 py-2 text-xs">Archive</button>`:''}${status==='archived'||status==='rejected'?`<button data-action="restore" data-id="${a.id}" class="border px-3 py-2 text-xs">Restore</button>`:''}<a href="/admin/edit?id=${encodeURIComponent(a.id)}" class="border px-3 py-2 text-xs">Edit</a>${status!=='published'?`<button data-action="delete" data-id="${a.id}" class="border border-red-300 text-red-700 px-3 py-2 text-xs">Delete</button>`:''}</div></td></tr>`}).join('')}async function act(action,id){const a=items.find(x=>x.id===id);if(!a)return;if(action==='delete'&&!confirm(`Permanently delete “${a.title}”? This cannot be undone.`))return;if(action==='archive'&&!confirm(`Archive “${a.title}”? It will no longer be public.`))return;if(action==='approve'&&!confirm(`Publish “${a.title}” publicly?`))return;let patch=null;if(action==='approve')patch={status:'published',published_at:new Date().toISOString(),updated_at:new Date().toISOString()};if(action==='reject')patch={status:'rejected',published_at:null,updated_at:new Date().toISOString()};if(action==='archive')patch={status:'archived',updated_at:new Date().toISOString()};if(action==='restore')patch={status:'draft',published_at:null,updated_at:new Date().toISOString()};if(action==='delete'){const{error}=await supabase.from('articles').delete().eq('id',id);if(error)return show(error.message);show('Content permanently deleted.',true);return load()}const{error}=await supabase.from('articles').update(patch).eq('id',id);if(error)return show(error.message);show(action==='approve'?'Published and now visible on the public site.':'Content updated.',true);load()}rows.onclick=e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.action,b.dataset.id)};document.querySelectorAll('.type-tab').forEach(b=>b.onclick=()=>{typeFilter=b.dataset.type;document.querySelectorAll('.type-tab').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');render()});document.querySelectorAll('.status-tab').forEach(b=>b.onclick=()=>{statusFilter=b.dataset.status;document.querySelectorAll('.status-tab').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');render()});$('#search').oninput=render;$('#sort').onchange=render;async function load(){const{data,error}=await supabase.from('articles').select('id,title,author_name,category,status,content_type,updated_at,created_at').order('updated_at',{ascending:false});if(error){rows.innerHTML='<tr><td colspan="7" class="p-8 text-red-700">Could not load editorial content: '+esc(error.message)+'</td></tr>';return}items=data||[];updateStats();render()}load();</script></body></html>
