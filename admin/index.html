<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Review - Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui,sans-serif}.serif{font-family:Georgia,serif}.pill{font-size:11px;letter-spacing:.08em;text-transform:uppercase}th{font-size:11px;letter-spacing:.12em;text-transform:uppercase}</style></head>
<body class="bg-[#fbf9f8] text-[#1b1c1c]"><main class="max-w-7xl mx-auto px-5 md:px-10 py-10">
<header class="flex flex-col md:flex-row md:items-end md:justify-between gap-6 border-b pb-7"><div><a href="/" class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">Economic Policy Lab</a><p class="text-xs uppercase tracking-[.18em] text-[#af2b3e] mt-5">Editorial administration</p><h1 class="serif text-4xl md:text-5xl font-bold mt-2">Review submissions</h1><p id="identity" class="text-gray-600 mt-2"></p></div><div class="flex gap-3"><a href="/articles" class="border px-4 py-2 text-sm">View website</a><button id="logout" class="border px-4 py-2 text-sm">Log out</button></div></header>
<section class="py-7 border-b"><div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4"><p class="text-gray-600">Review and edit all Articles and Research. Admins cannot create new submissions.</p><div class="flex flex-wrap gap-2" id="type-tabs"><button data-type="all" class="type-tab bg-black text-white px-4 py-2 text-sm">All content</button><button data-type="article" class="type-tab border px-4 py-2 text-sm">Articles</button><button data-type="research" class="type-tab border px-4 py-2 text-sm">Research</button></div></div><div class="flex flex-wrap gap-2 mt-4" id="status-tabs"><button data-status="all" class="status-tab bg-black text-white px-3 py-2 text-xs uppercase tracking-wider">All statuses</button><button data-status="pending" class="status-tab border px-3 py-2 text-xs uppercase tracking-wider">Needs review</button><button data-status="published" class="status-tab border px-3 py-2 text-xs uppercase tracking-wider">Published</button><button data-status="draft" class="status-tab border px-3 py-2 text-xs uppercase tracking-wider">Drafts</button><button data-status="archived" class="status-tab border px-3 py-2 text-xs uppercase tracking-wider">Archived</button><button data-status="rejected" class="status-tab border px-3 py-2 text-xs uppercase tracking-wider">Rejected</button></div></section>
<div id="message" class="hidden mt-5 p-4 border"></div>
<section class="mt-6 bg-white border overflow-x-auto"><table class="w-full min-w-[1000px] border-collapse"><thead class="bg-[#f5f3f2] border-b"><tr><th class="text-left p-4">Type</th><th class="text-left p-4">Title</th><th class="text-left p-4">Author</th><th class="text-left p-4">Category</th><th class="text-left p-4">Status</th><th class="text-left p-4">Updated</th><th class="text-right p-4">Actions</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="p-8 text-gray-500">Loading…</td></tr></tbody></table></section>
</main><script type="module">import{supabase}from'../supabase-client.js';const $=s=>document.querySelector(s),rows=$('#rows'),msg=$('#message');let items=[],typeFilter='all',statusFilter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function show(t,ok=false){msg.textContent=t;msg.className='mt-5 p-4 border '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50')}const{data:{session}}=await supabase.auth.getSession();if(!session)location.href='/auth/';const{data:profile}=await supabase.from('profiles').select('role,display_name').eq('id',session.user.id).single();if(profile?.role!=='admin'){location.href='/member';throw new Error('not admin')}$('#identity').textContent=profile.display_name||session.user.email;$('#logout').onclick=async()=>{await supabase.auth.signOut();location.href='/auth/'};async function load(){const{data,error}=await supabase.from('articles').select('id,title,author_name,category,status,content_type,updated_at,created_at').order('updated_at',{ascending:false});if(error){rows.innerHTML='<tr><td colspan="7" class="p-8 text-red-700">Could not load submissions: '+esc(error.message)+'</td></tr>';return}items=data||[];render()}function render(){const list=items.filter(a=>(typeFilter==='all'||(a.content_type||'article')===typeFilter)&&(statusFilter==='all'||a.status===statusFilter));if(!list.length){rows.innerHTML='<tr><td colspan="7" class="p-10 text-center text-gray-500">No submissions match these filters.</td></tr>';return}rows.innerHTML=list.map(a=>{const research=a.content_type==='research',badge=a.status==='pending'?'bg-amber-50 text-amber-800 border-amber-200':a.status==='published'?'bg-green-50 text-green-800 border-green-200':a.status==='rejected'?'bg-red-50 text-red-800 border-red-200':a.status==='archived'?'bg-gray-100 text-gray-700 border-gray-300':'bg-white text-gray-700 border-gray-300';return `<tr class="border-b last:border-b-0 hover:bg-[#fcfbfa]"><td class="p-4 align-top"><span class="pill border px-2 py-1 ${research?'text-[#af2b3e]':''}">${research?'Research':'Article'}</span></td><td class="p-4 align-top max-w-[340px]"><div class="serif text-lg font-bold">${esc(a.title||'Untitled')}</div></td><td class="p-4 align-top text-sm">${esc(a.author_name||'EPL Member')}</td><td class="p-4 align-top text-sm text-gray-600">${esc(a.category||'—')}</td><td class="p-4 align-top"><span class="pill border px-2 py-1 ${badge}">${esc(a.status)}</span></td><td class="p-4 align-top text-sm text-gray-600 whitespace-nowrap">${new Date(a.updated_at||a.created_at).toLocaleDateString()}</td><td class="p-4 align-top"><div class="flex flex-wrap justify-end gap-2">${a.status==='pending'?`<button data-action="approve" data-id="${a.id}" class="bg-black text-white px-3 py-2 text-xs">Approve</button><button data-action="reject" data-id="${a.id}" class="border px-3 py-2 text-xs">Reject</button>`:''}${a.status==='published'?`<button data-action="archive" data-id="${a.id}" class="border px-3 py-2 text-xs">Archive</button>`:''}${a.status==='archived'||a.status==='rejected'?`<button data-action="restore" data-id="${a.id}" class="border px-3 py-2 text-xs">Restore</button>`:''}<a href="/admin/edit?id=${encodeURIComponent(a.id)}" class="border px-3 py-2 text-xs">Edit</a></div></td></tr>`}).join('')}async function act(action,id){let patch;if(action==='approve')patch={status:'published',published_at:new Date().toISOString()};if(action==='reject')patch={status:'rejected',published_at:null};if(action==='archive')patch={status:'archived'};if(action==='restore')patch={status:'draft',published_at:null};if(!patch)return;const{error}=await supabase.from('articles').update(patch).eq('id',id);if(error)return show(error.message);show(action==='approve'?'Published.':'Submission updated.',true);load()}rows.onclick=e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.action,b.dataset.id)};document.querySelectorAll('.type-tab').forEach(b=>b.onclick=()=>{typeFilter=b.dataset.type;document.querySelectorAll('.type-tab').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');render()});document.querySelectorAll('.status-tab').forEach(b=>b.onclick=()=>{statusFilter=b.dataset.status;document.querySelectorAll('.status-tab').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');render()});load();</script></body></html>
