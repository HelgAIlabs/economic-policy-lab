<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Submission - EPL Admin</title><script src="https://cdn.tailwindcss.com"></script><style>[contenteditable]{outline:none}.editor p{margin:1em 0}.editor h2{font:700 1.5rem Georgia,serif;margin:1.2em 0 .5em}.editor a{color:#af2b3e;text-decoration:underline}.editor img{max-width:100%;height:auto;margin:1rem 0}</style></head><body class="bg-[#fbf9f8] text-[#1b1c1c]"><main class="max-w-5xl mx-auto px-5 md:px-10 py-10"><a href="/admin" class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">← Admin dashboard</a><h1 class="font-serif text-4xl md:text-5xl font-bold mt-5">Edit submission</h1><div id="message" class="hidden mt-5 p-4 border"></div><form id="form" class="mt-8 space-y-6"><section class="bg-white border p-6 md:p-8 space-y-5"><div><label class="block text-sm font-semibold">Content type</label><select id="content_type" class="mt-2 w-full border p-3 font-normal"><option value="article">Article</option><option value="research">Research</option></select><p class="text-xs text-gray-500 mt-2">Admins can change an existing submission between Articles and Research.</p></div><label class="block text-sm font-semibold">Author name<input id="author_name" class="mt-2 w-full border p-3 font-normal"></label><label class="block text-sm font-semibold">Title<input id="title" class="mt-2 w-full border p-3 text-xl font-serif font-normal"></label><label class="block text-sm font-semibold">Excerpt / abstract<textarea id="excerpt" rows="3" class="mt-2 w-full border p-3 font-normal"></textarea></label><label class="block text-sm font-semibold">Category<input id="category" class="mt-2 w-full border p-3 font-normal"></label><label class="block text-sm font-semibold">Status<select id="status" class="mt-2 w-full border p-3 font-normal"><option value="draft">Draft</option><option value="pending">Pending</option><option value="published">Published</option><option value="rejected">Rejected</option><option value="archived">Archived</option></select></label></section><section class="bg-white border"><div class="flex flex-wrap gap-1 border-b bg-[#f6f4f2] p-2" id="toolbar"><button type="button" data-cmd="bold" class="px-3 py-2 border bg-white font-bold">B</button><button type="button" data-cmd="italic" class="px-3 py-2 border bg-white italic">I</button><button type="button" data-cmd="underline" class="px-3 py-2 border bg-white underline">U</button><button type="button" data-cmd="formatBlock" data-value="h2" class="px-3 py-2 border bg-white">Heading</button><button type="button" data-cmd="insertUnorderedList" class="px-3 py-2 border bg-white">• List</button><button type="button" id="link" class="px-3 py-2 border bg-white">Link</button></div><div id="editor" class="editor min-h-[450px] border p-6 md:p-8 text-lg leading-8" contenteditable="true"></div></section><div class="flex justify-between"><a href="/admin" class="border px-5 py-3 text-sm">Cancel</a><button class="bg-black text-white px-6 py-3 text-sm uppercase tracking-wider">Save changes</button></div></form></main><script type="module">import{supabase}from'../../supabase-client.js';const $=s=>document.querySelector(s),id=new URLSearchParams(location.search).get('id'),msg=$('#message'),editor=$('#editor');function show(t,ok=false){msg.textContent=t;msg.className='mt-5 p-4 border '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50')}const{data:{session}}=await supabase.auth.getSession();if(!session||!id)location.href='/admin';const{data:profile}=await supabase.from('profiles').select('role').eq('id',session.user.id).single();if(profile?.role!=='admin')location.href='/member';const{data:a,error}=await supabase.from('articles').select('*').eq('id',id).single();if(error||!a){show('Submission not found.');throw Error('not found')}$('#content_type').value=a.content_type||'article';$('#author_name').value=a.author_name||'';$('#title').value=a.title||'';$('#excerpt').value=a.excerpt||'';$('#category').value=a.category||'';$('#status').value=a.status;editor.innerHTML=a.content||'';document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{editor.focus();document.execCommand(b.dataset.cmd,false,b.dataset.value||null)});$('#link').onclick=()=>{editor.focus();const u=prompt('URL:');if(u)document.execCommand('createLink',false,u)};$('#form').onsubmit=async e=>{e.preventDefault();const status=$('#status').value;const patch={content_type:$('#content_type').value,author_name:$('#author_name').value.trim(),title:$('#title').value.trim(),excerpt:$('#excerpt').value.trim(),category:$('#category').value.trim(),content:editor.innerHTML,status,updated_at:new Date().toISOString(),published_at:status==='published'?(a.published_at||new Date().toISOString()):null};const{error}=await supabase.from('articles').update(patch).eq('id',id);if(error)return show(error.message);show('Changes saved.',true);setTimeout(()=>location.href='/admin',700)};</script></body></html>
