<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Content — EPL Admin</title><script src="https://cdn.tailwindcss.com"></script><style>[contenteditable]{outline:none}.editor p{margin:1em 0}.editor h2{font:700 1.55rem Georgia,serif;margin:1.25em 0 .55em}.editor h3{font:700 1.25rem Georgia,serif;margin:1.2em 0 .5em}.editor a{color:#af2b3e;text-decoration:underline}.editor img{max-width:100%;height:auto;margin:1rem 0}.editor blockquote{border-left:3px solid #af2b3e;padding-left:1rem;color:#555}.toolbar button{min-width:38px}</style></head><body class="bg-[#fbf9f8] text-[#1b1c1c]"><main class="max-w-6xl mx-auto px-5 md:px-10 py-8 md:py-12"><header class="flex justify-between items-start border-b pb-7"><div><a href="/admin" class="text-xs uppercase tracking-[.2em] text-[#af2b3e]">← Editorial queue</a><h1 class="font-serif text-4xl md:text-5xl font-bold mt-4">Edit website content</h1><p class="text-gray-600 mt-2">Changes to published content are reflected on the public Articles or Research page.</p></div><a href="/" class="text-sm underline">EPL home</a></header><div id="message" class="hidden mt-6 p-4 border"></div><form id="form" class="mt-8 space-y-6"><section class="bg-white border p-6 md:p-8 grid md:grid-cols-2 gap-5"><div><label class="block text-sm font-semibold">Content type<select id="content_type" class="mt-2 w-full border p-3 font-normal"><option value="article">Article</option><option value="research">Research</option></select></label><p class="text-xs text-gray-500 mt-2">Move the piece between Articles and Research.</p></div><label class="block text-sm font-semibold">Author name<input id="author_name" maxlength="120" class="mt-2 w-full border p-3 font-normal"></label><label class="block text-sm font-semibold md:col-span-2">Title<input id="title" required maxlength="240" class="mt-2 w-full border p-3 text-xl font-serif font-normal"></label><label class="block text-sm font-semibold md:col-span-2">Abstract / excerpt<textarea id="excerpt" rows="4" maxlength="4000" class="mt-2 w-full border p-3 font-normal"></textarea></label><label class="block text-sm font-semibold">Category<input id="category" maxlength="120" class="mt-2 w-full border p-3 font-normal"></label><div><label class="block text-sm font-semibold">Cover image</label><div class="flex gap-2 mt-2"><input id="cover_file" type="file" accept="image/*" class="text-sm flex-1"><button type="button" id="cover_upload" class="border px-3 py-2 text-xs">Upload</button></div><input id="cover_image_url" type="url" placeholder="Or paste an image URL" class="mt-2 w-full border p-3 font-normal"><img id="cover_preview" class="hidden mt-3 max-h-48 w-full object-cover border" alt="Cover preview"></div><label class="block text-sm font-semibold">Publication status<select id="status" class="mt-2 w-full border p-3 font-normal"><option value="draft">Draft</option><option value="pending">Needs review</option><option value="published">Published</option><option value="rejected">Rejected</option><option value="archived">Archived</option></select></label></section><section class="bg-white border"><div class="p-5 md:p-7"><div class="flex flex-wrap gap-1 toolbar border border-b-0 bg-[#f6f4f2] p-2"><button type="button" data-cmd="bold" class="px-3 py-2 border bg-white font-bold">B</button><button type="button" data-cmd="italic" class="px-3 py-2 border bg-white italic">I</button><button type="button" data-cmd="underline" class="px-3 py-2 border bg-white underline">U</button><button type="button" data-cmd="formatBlock" data-value="h2" class="px-3 py-2 border bg-white">H2</button><button type="button" data-cmd="formatBlock" data-value="h3" class="px-3 py-2 border bg-white">H3</button><button type="button" data-cmd="insertUnorderedList" class="px-3 py-2 border bg-white">• List</button><button type="button" data-cmd="insertOrderedList" class="px-3 py-2 border bg-white">1. List</button><button type="button" data-cmd="justifyLeft" class="px-3 py-2 border bg-white">Left</button><button type="button" data-cmd="justifyCenter" class="px-3 py-2 border bg-white">Center</button><button type="button" data-cmd="justifyRight" class="px-3 py-2 border bg-white">Right</button><button type="button" data-cmd="outdent" class="px-3 py-2 border bg-white">Outdent</button><button type="button" data-cmd="indent" class="px-3 py-2 border bg-white">Indent</button><button type="button" id="link" class="px-3 py-2 border bg-white">Link</button><button type="button" id="quote" class="px-3 py-2 border bg-white">Quote</button><button type="button" id="image" class="px-3 py-2 border bg-white">Add image</button><input id="image_file" type="file" accept="image/*" class="hidden"></div><div id="editor" class="editor min-h-[500px] border p-6 md:p-8 text-lg leading-8" contenteditable="true"></div><p class="text-xs text-gray-500 mt-3">Use Indent/Outdent for paragraph spacing and structure. Images upload to EPL storage.</p></div></section><div class="flex flex-wrap justify-between gap-3"><a href="/admin" class="border px-5 py-3 text-sm">Cancel</a><button class="bg-black text-white px-6 py-3 text-sm uppercase tracking-wider">Save changes</button></div></form></main><script type="module">import{supabase}from'../../supabase-client.js';const $=s=>document.querySelector(s),id=new URLSearchParams(location.search).get('id'),msg=$('#message'),editor=$('#editor');let item;function show(t,ok=false){msg.textContent=t;msg.className='mt-6 p-4 border '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50');msg.classList.remove('hidden')}const{data:{session}}=await supabase.auth.getSession();if(!session||!id)location.href='/login/';const{data:isAdmin}=await supabase.rpc('is_admin');if(isAdmin!==true)location.href='/member';const{data:a,error}=await supabase.from('articles').select('*').eq('id',id).single();if(error||!a){show('Content not found.');throw Error('not found')}item=a;$('#content_type').value=a.content_type||'article';$('#author_name').value=a.author_name||'';$('#title').value=a.title||'';$('#excerpt').value=a.excerpt||'';$('#category').value=a.category||'';$('#cover_image_url').value=a.cover_image_url||'';$('#status').value=a.status;editor.innerHTML=a.content||'';if(a.cover_image_url){$('#cover_preview').src=a.cover_image_url;$('#cover_preview').classList.remove('hidden')}document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{editor.focus();document.execCommand(b.dataset.cmd,false,b.dataset.value||null)});$('#link').onclick=()=>{editor.focus();const u=prompt('Paste the URL:');if(u)document.execCommand('createLink',false,u)};$('#quote').onclick=()=>{editor.focus();document.execCommand('formatBlock',false,'blockquote')};async function upload(file){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${session.user.id}/admin-${crypto.randomUUID()}.${ext}`;const{error}=await supabase.storage.from('article-images').upload(path,file,{contentType:file.type,upsert:false});if(error){show(error.message);return null}return supabase.storage.from('article-images').getPublicUrl(path).data.publicUrl}$('#image').onclick=()=>$('#image_file').click();$('#image_file').onchange=async e=>{const u=await upload(e.target.files[0]);if(u){editor.focus();document.execCommand('insertImage',false,u)}};$('#cover_upload').onclick=async()=>{const u=await upload($('#cover_file').files[0]);if(u){$('#cover_image_url').value=u;$('#cover_preview').src=u;$('#cover_preview').classList.remove('hidden')}};$('#cover_image_url').oninput=()=>{const u=$('#cover_image_url').value.trim();if(u){$('#cover_preview').src=u;$('#cover_preview').classList.remove('hidden')}};$('#form').onsubmit=async e=>{e.preventDefault();const status=$('#status').value;if(status==='published'&&item.status!=='published'&&!confirm(`Publish “${$('#title').value.trim()}” publicly?`))return;if(status==='archived'&&item.status!=='archived'&&!confirm(`Archive “${$('#title').value.trim()}”? It will no longer be public.`))return;const patch={content_type:$('#content_type').value,author_name:$('#author_name').value.trim(),title:$('#title').value.trim(),excerpt:$('#excerpt').value.trim(),category:$('#category').value.trim(),cover_image_url:$('#cover_image_url').value.trim()||null,content:editor.innerHTML,status,updated_at:new Date().toISOString(),published_at:status==='published'?(item.published_at||new Date().toISOString()):null};const{error}=await supabase.from('articles').update(patch).eq('id',id);if(error)return show(error.message);show('Saved. Public content is synced.',true);setTimeout(()=>location.href='/admin',700)};</script></body></html>
