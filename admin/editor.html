<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Content — EPL Admin</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,sans-serif}.serif{font-family:Georgia,serif}.editor p{margin:1em 0}.editor h2{font:700 1.55rem Georgia,serif;margin:1.25em 0 .55em}.editor h3{font:700 1.25rem Georgia,serif;margin:1.2em 0 .5em}.editor a{color:#af2b3e;text-decoration:underline}.editor img{max-width:100%;height:auto;margin:1rem 0}</style></head><body class="bg-[#fbf9f8] text-[#1b1c1c]"><main class="max-w-6xl mx-auto px-5 md:px-10 py-8 md:py-12"><header class="border-b pb-7"><a href="/admin" class="text-xs uppercase tracking-[.2em] text-[#af2b3e]">← Editorial queue</a><h1 class="serif text-4xl md:text-5xl font-bold mt-4">Edit website content</h1><p class="text-gray-600 mt-2">Every saved change is immediately available to the public page when the content is published.</p></header><div id="message" class="hidden mt-6 p-4 border"></div><form id="form" class="mt-8 space-y-6"><section class="bg-white border p-6 md:p-8 grid md:grid-cols-2 gap-5"><label class="block text-sm font-semibold">Content type<select id="type" class="mt-2 w-full border p-3 font-normal"><option value="article">Article</option><option value="research">Research</option></select></label><label class="block text-sm font-semibold">Author name<input id="author" class="mt-2 w-full border p-3 font-normal"></label><label class="block text-sm font-semibold md:col-span-2">Title<input id="title" required class="mt-2 w-full border p-3 text-xl font-normal"></label><label class="block text-sm font-semibold md:col-span-2">Abstract / excerpt<textarea id="excerpt" rows="4" class="mt-2 w-full border p-3 font-normal"></textarea></label><label class="block text-sm font-semibold">Category<input id="category" class="mt-2 w-full border p-3 font-normal"></label><label class="block text-sm font-semibold">Status<select id="status" class="mt-2 w-full border p-3 font-normal"><option value="draft">Draft</option><option value="pending">Needs review</option><option value="published">Published</option><option value="rejected">Declined</option><option value="archived">Archived</option></select></label><div><label class="block text-sm font-semibold">Cover image URL</label><input id="cover" type="url" class="mt-2 w-full border p-3 font-normal"></div><div><label class="block text-sm font-semibold">Home placement</label><div class="border p-4 mt-2"><label class="flex gap-3 items-center"><input id="featured" type="checkbox" class="h-4 w-4"> Feature on Home</label><label class="block text-sm mt-3">Featured order<input id="featuredOrder" type="number" min="0" value="0" class="mt-2 w-24 border p-2 font-normal"></label><p class="text-xs text-gray-500 mt-2">Lower numbers appear first. Articles and Research can both be featured.</p></div></div></section><section class="bg-white border p-5 md:p-7"><div class="flex flex-wrap gap-1 border border-b-0 bg-[#f6f4f2] p-2"><button type="button" data-cmd="bold" class="px-3 py-2 border bg-white font-bold">B</button><button type="button" data-cmd="italic" class="px-3 py-2 border bg-white italic">I</button><button type="button" data-cmd="formatBlock" data-value="h2" class="px-3 py-2 border bg-white">H2</button><button type="button" data-cmd="formatBlock" data-value="h3" class="px-3 py-2 border bg-white">H3</button><button type="button" data-cmd="insertUnorderedList" class="px-3 py-2 border bg-white">• List</button><button type="button" data-cmd="insertOrderedList" class="px-3 py-2 border bg-white">1. List</button><button type="button" id="link" class="px-3 py-2 border bg-white">Link</button><button type="button" id="quote" class="px-3 py-2 border bg-white">Quote</button></div><div id="editor" contenteditable="true" class="editor min-h-[520px] border p-6 text-lg leading-8"></div></section><div class="flex justify-between gap-3"><a href="/admin" class="border px-5 py-3">Cancel</a><button class="bg-black text-white px-6 py-3 uppercase tracking-wider">Save changes</button></div></form></main><script type="module">import{supabase}from'../../supabase-client.js';const $=s=>document.querySelector(s),id=new URLSearchParams(location.search).get('id'),editor=$('#editor'),message=$('#message');let item;function show(t,ok=false){message.textContent=t;message.className='mt-6 p-4 border '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50')}const s=await supabase.auth.getSession();if(!s.data.session||!id){location.href='/login/';throw Error('no session')}const session=s.data.session;const p=await supabase.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(p.data?.role!=='admin'){location.href='/member/';throw Error('not admin')}const r=await supabase.from('articles').select('*').eq('id',id).single();if(r.error){show(r.error.message);throw r.error}item=r.data;$('#type').value=item.content_type||'article';$('#author').value=item.author_name||'';$('#title').value=item.title||'';$('#excerpt').value=item.excerpt||'';$('#category').value=item.category||'';$('#status').value=item.status||'draft';$('#cover').value=item.cover_image_url||'';$('#featured').checked=!!item.is_featured;$('#featuredOrder').value=item.featured_order||0;editor.innerHTML=item.content||'';document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{editor.focus();document.execCommand(b.dataset.cmd,false,b.dataset.value||null)});$('#link').onclick=()=>{editor.focus();const u=prompt('Paste URL');if(u)document.execCommand('createLink',false,u)};$('#quote').onclick=()=>{editor.focus();document.execCommand('formatBlock',false,'blockquote')};$('#form').onsubmit=async e=>{e.preventDefault();const status=$('#status').value;const patch={content_type:$('#type').value,author_name:$('#author').value.trim(),title:$('#title').value.trim(),excerpt:$('#excerpt').value.trim(),category:$('#category').value.trim(),cover_image_url:$('#cover').value.trim()||null,content:editor.innerHTML,status,is_featured:status==='published'&&$('#featured').checked,featured_order:Number($('#featuredOrder').value)||0,updated_at:new Date().toISOString(),published_at:status==='published'?(item.published_at||new Date().toISOString()):null};if(status==='published'&&item.status!=='published'&&!confirm(`Publish “${patch.title}” publicly?`))return;if(status==='archived'&&!confirm(`Archive “${patch.title}”? It will not be public.`))return;const u=await supabase.from('articles').update(patch).eq('id',id);if(u.error)return show(u.error.message);show('Saved. Public Articles/Research and Home are synchronized.',true);setTimeout(()=>location.href='/admin',800)}</script></body></html>
