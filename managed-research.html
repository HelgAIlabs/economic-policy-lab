<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Archive — Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif}.serif{font-family:'Playfair Display',Georgia,serif}.item:hover h2{color:#af2b3e}</style></head><body class="bg-[#fbf9f8] text-[#1b1c1c]"><header class="border-b-2 border-gray-300"><div class="max-w-7xl mx-auto px-5 md:px-12 py-5"><div class="flex justify-between items-center"><a href="/" class="serif text-3xl md:text-5xl font-bold tracking-tight">Economic Policy Lab</a><a href="/login" class="bg-black text-white px-5 py-3 text-xs uppercase tracking-wider">Log in</a></div><nav class="flex flex-wrap justify-center gap-7 mt-5 text-xs uppercase tracking-wider"><a href="/">Home</a><a href="/research" class="text-[#af2b3e] border-b-2 border-[#af2b3e] pb-2">Research</a><a href="/articles">Articles</a><a href="/team">Team</a><a href="/join">Join Us</a></nav></div></header><main class="max-w-7xl mx-auto px-5 md:px-12 py-12 md:py-20"><div class="text-center border-b pb-8 mb-10"><p class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">Research archive</p><h1 class="serif text-5xl md:text-6xl font-bold mt-3">Research Archive</h1><p class="text-lg text-gray-600 max-w-3xl mx-auto mt-4">Working papers, policy briefs, reports, and in-depth research from the Economic Policy Lab.</p></div><div id="content" class="max-w-5xl mx-auto space-y-8"><p class="text-gray-500">Loading research…</p></div></main><footer class="border-t mt-12"><div class="max-w-7xl mx-auto px-5 md:px-12 py-12 text-sm text-gray-600">© 2025 Komunitas Ekonom Muda Indonesia / Economic Policy Lab. All rights reserved.</div></footer><script type="module">import{supabase}from'./supabase-client.js';const root=document.querySelector('#content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const{data,error}=await supabase.from('articles').select('id,title,excerpt,category,author_name,cover_image_url,published_at').eq('content_type','research').eq('status','published').order('published_at',{ascending:false});if(error){root.innerHTML='<p class="text-red-700">Unable to load research.</p>'}else if(!data?.length){root.innerHTML='<p class="text-gray-500">No published research yet.</p>'}else{root.innerHTML=data.map(a=>`<a href="/content?id=${encodeURIComponent(a.id)}" class="item grid md:grid-cols-3 gap-7 border-b pb-8 block"><div class="bg-gray-200 min-h-48 overflow-hidden">${a.cover_image_url?`<img src="${esc(a.cover_image_url)}" alt="" class="w-full h-full min-h-48 object-cover grayscale">`:''}</div><div class="md:col-span-2"><div class="flex gap-3 items-center"><span class="text-xs uppercase tracking-wider bg-gray-200 px-2 py-1">${esc(a.category||'Research')}</span>${a.published_at?`<span class="text-xs text-gray-500">${new Date(a.published_at).toLocaleDateString(undefined,{year:'numeric',month:'long'})}</span>`:''}</div><h2 class="serif text-3xl font-bold mt-3">${esc(a.title)}</h2><p class="text-sm italic text-gray-600 mt-2">By ${esc(a.author_name||'EPL Research Group')}</p><p class="text-base leading-7 mt-4 text-gray-700">${esc(a.excerpt||'')}</p><span class="text-xs uppercase tracking-wider inline-block mt-5">Read research →</span></div></a>`).join('')}</script></body></html>
