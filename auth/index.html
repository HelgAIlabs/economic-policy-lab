<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Access - Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-[#fbf9f8] text-[#1b1c1c]"><main class="min-h-screen flex items-center justify-center px-5 py-12"><section class="w-full max-w-md bg-white border border-[#e0e0e0] p-8">
<a href="/" class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">Economic Policy Lab</a><h1 class="font-serif text-4xl font-bold mt-5 mb-2">Member access</h1><p class="text-gray-600 mb-7">Sign in to submit, manage, and review articles.</p>
<div id="message" class="hidden mb-4 p-3 text-sm border"></div><form id="auth-form" class="space-y-4"><label class="block text-sm font-semibold">Email<input id="email" type="email" autocomplete="email" required class="mt-1 w-full border p-3"></label><label class="block text-sm font-semibold">Password<input id="password" type="password" autocomplete="current-password" required class="mt-1 w-full border p-3"></label><button class="w-full bg-black text-white py-3 uppercase tracking-wider text-sm font-semibold">Sign in</button></form>
<button id="reset" class="w-full border py-3 text-sm mt-4">Reset password</button><p class="text-xs text-gray-500 mt-5">Use the EPL account provided to you. Public account creation is disabled.</p><a href="/" class="block text-center text-sm mt-7 underline">Back to EPL</a></section></main>
<script type="module">import {supabase} from '../supabase-client.js'; const form=document.querySelector('#auth-form'),email=document.querySelector('#email'),password=document.querySelector('#password'),msg=document.querySelector('#message'); function show(t,ok=false){msg.textContent=t;msg.className='mb-4 p-3 text-sm border '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50');} async function route(){const {data:{session}}=await supabase.auth.getSession();if(!session)return;const {data:profile}=await supabase.from('profiles').select('role').eq('id',session.user.id).single();location.href=profile?.role==='admin'?'/admin':'/member';} route(); form.addEventListener('submit',async e=>{e.preventDefault();const {error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return show(error.message);route();}); document.querySelector('#reset').onclick=async()=>{if(!email.value.trim())return show('Enter your email first.');const {error}=await supabase.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+'/auth/'});if(error)return show(error.message,true);show('Password reset email sent.',true);};</script></body></html>
