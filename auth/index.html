<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in - Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-[#fbf9f8] text-[#1b1c1c]"><main class="min-h-screen flex items-center justify-center px-5 py-12"><section class="w-full max-w-md bg-white border border-[#e0e0e0] p-8">
<a href="/" class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">Economic Policy Lab</a><h1 class="font-serif text-4xl font-bold mt-5 mb-2">Sign in</h1><p class="text-gray-600 mb-7">Sign in and you’ll be sent to the workspace for your account.</p>
<div id="message" class="hidden mb-4 p-3 text-sm border"></div><form id="auth-form" class="space-y-4"><label class="block text-sm font-semibold">Email<input id="email" type="email" autocomplete="username" required class="mt-1 w-full border p-3"></label><label class="block text-sm font-semibold">Password<input id="password" type="password" autocomplete="current-password" required class="mt-1 w-full border p-3"></label><button id="submit" class="w-full bg-black text-white py-3 uppercase tracking-wider text-sm font-semibold">Sign in</button></form>
<button id="reset" class="w-full border py-3 text-sm mt-4">Reset password</button><div class="mt-6 grid grid-cols-2 gap-2 text-xs"><div class="border p-3"><strong>Member</strong><br><span class="text-gray-500">Submit and manage your work</span></div><div class="border p-3"><strong>Admin</strong><br><span class="text-gray-500">Review and edit site content</span></div></div><p id="session-note" class="text-xs text-gray-500 mt-5"></p><p class="text-xs text-gray-500 mt-3">Use the EPL account provided to you. Public account creation is disabled.</p><a href="/" class="block text-center text-sm mt-7 underline">Back to EPL</a></section></main>
<script type="module">
import {supabase} from '../supabase-client.js';
const form=document.querySelector('#auth-form'),email=document.querySelector('#email'),password=document.querySelector('#password'),msg=document.querySelector('#message'),submit=document.querySelector('#submit'),sessionNote=document.querySelector('#session-note');
function show(t,ok=false){msg.textContent=t;msg.className='mb-4 p-3 text-sm border '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50');}
async function getDestination(){
  const {data:{session},error:sessionError}=await supabase.auth.getSession();
  if(sessionError||!session)return null;
  const {data:profile,error:profileError}=await supabase.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  if(!profileError && profile?.role==='admin')return '/admin';
  if(!profileError && profile?.role==='member')return '/member';
  const {data:isAdmin,error:adminError}=await supabase.rpc('is_admin');
  if(!adminError && isAdmin===true)return '/admin';
  if(!profileError && !profile)return null;
  return null;
}
async function showExistingSession(){
  const destination=await getDestination();
  if(destination){
    sessionNote.textContent='You are already signed in. Signing in below will switch accounts if needed.';
  }
}
showExistingSession();
form.addEventListener('submit',async e=>{
  e.preventDefault();
  submit.disabled=true;submit.textContent='Signing in…';
  show('');msg.classList.add('hidden');
  // Explicitly clear any existing session first. This prevents an old member
  // session from racing the new admin login and redirecting back to /member.
  await supabase.auth.signOut({scope:'local'});
  const {error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});
  if(error){submit.disabled=false;submit.textContent='Sign in';return show(error.message);}
  const destination=await getDestination();
  if(destination){location.replace(destination);return;}
  submit.disabled=false;submit.textContent='Sign in';
  return show('Signed in, but this account has no valid EPL role. Please contact an administrator.');
});
document.querySelector('#reset').onclick=async()=>{if(!email.value.trim())return show('Enter your email first.');const {error}=await supabase.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+'/auth/'});if(error)return show(error.message);show('Password reset email sent.',true);};
</script></body></html>
