name: Enhance EPL navigation lines

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add stronger navigation dividers
        shell: python
        run: |
          from pathlib import Path

          css = r'''
          /* EPL navigation dividers: visible grey rules above and below navigation */
          header nav {
            border-top: 2px solid #B8B8B8 !important;
            border-bottom: 2px solid #B8B8B8 !important;
            padding-top: 12px !important;
            padding-bottom: 12px !important;
            box-sizing: border-box !important;
          }

          @media (max-width: 767px) {
            header nav {
              border-top-width: 2px !important;
              border-bottom-width: 2px !important;
              padding-top: 10px !important;
              padding-bottom: 10px !important;
            }
          }
          '''

          marker = '/* EPL navigation dividers: visible grey rules above and below navigation */'
          files = [
              Path('home/expanded-articles.html'),
              Path('research/index.html'),
              Path('articles/index.html'),
              Path('team/index.html'),
              Path('join/index.html'),
          ]

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              text = text.replace('</head>', '<style>\n' + css + '\n</style>\n</head>', 1)
              path.write_text(text, encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/expanded-articles.html research/index.html articles/index.html team/index.html join/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Strengthen header navigation dividers"
          git push
