name: Clean and fix EPL header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace accumulated header overrides with one clean rule
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('home/expanded-articles.html'),
              Path('research/index.html'),
              Path('articles/index.html'),
              Path('team/index.html'),
              Path('join/index.html'),
          ]

          final_css = r'''
          /* EPL FINAL HEADER — one clean responsive header rule */
          html, body { margin: 0 !important; padding: 0 !important; overflow-x: hidden !important; }
          header { border: 0 !important; outline: 0 !important; box-shadow: none !important; width: 100% !important; max-width: none !important; margin: 0 !important; }
          header > div { width: 100% !important; max-width: none !important; box-sizing: border-box !important; }
          header > div > div:first-child {
            position: relative !important;
            min-height: 58px !important;
            margin-bottom: 5px !important;
            border: 0 !important;
            box-shadow: none !important;
          }
          header > div > div:first-child > a:first-of-type,
          header .epl-site-title {
            position: absolute !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: min(68vw, 760px) !important;
            max-width: calc(100% - 220px) !important;
            margin: 0 !important;
            padding: 0 !important;
            text-align: center !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            font-size: clamp(22px, 4vw, 48px) !important;
            line-height: 1 !important;
            z-index: 2 !important;
          }
          header nav {
            position: relative !important;
            z-index: 3 !important;
            width: 100vw !important;
            max-width: none !important;
            margin-left: calc(50% - 50vw) !important;
            margin-right: calc(50% - 50vw) !important;
            margin-top: 0 !important;
            box-sizing: border-box !important;
            border-top: 2px solid #B8B8B8 !important;
            border-bottom: 2px solid #B8B8B8 !important;
            border-left: 0 !important;
            border-right: 0 !important;
            padding-top: 5px !important;
            padding-bottom: 12px !important;
            overflow-x: auto !important;
            scrollbar-width: none !important;
          }
          header nav::-webkit-scrollbar { display: none !important; }
          @media (max-width: 767px) {
            header > div { padding-left: 20px !important; padding-right: 20px !important; }
            header > div > div:first-child { min-height: 42px !important; margin-bottom: 5px !important; }
            header > div > div:first-child > a:first-of-type,
            header .epl-site-title {
              width: 78vw !important;
              max-width: calc(100% - 92px) !important;
              font-size: clamp(19px, 7vw, 30px) !important;
            }
            header nav { padding-top: 5px !important; padding-bottom: 10px !important; }
          }
          @media (min-width: 768px) and (max-width: 1100px) {
            header > div > div:first-child > a:first-of-type,
            header .epl-site-title { max-width: calc(100% - 190px) !important; }
          }
          '''

          old_markers = (
              'EPL shared header:',
              'EPL full-bleed shell:',
              'EPL navigation dividers:',
              'EPL FINAL HEADER:'
          )
          pattern = re.compile(r'<style\b[^>]*>.*?</style>\s*', re.I | re.S)

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = pattern.sub(lambda m: '' if any(marker in m.group(0) for marker in old_markers) else m.group(0), text)
              text = text.replace('</head>', '<style>\n' + final_css + '\n</style>\n</head>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit clean header
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/expanded-articles.html research/index.html articles/index.html team/index.html join/index.html
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
            exit 0
          fi
          git commit -m "Clean up accumulated header overrides"
          git push
