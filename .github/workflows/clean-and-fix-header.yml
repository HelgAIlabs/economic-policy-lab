name: Clean and fix EPL header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one consistent responsive EPL header
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('home/expanded-articles.html'),
              Path('research/index.html'),
              Path('articles/index.html'),
              Path('team/index.html'),
              Path('join/index.html'),
          ]

          final_css = r'''
          /* EPL HEADER — exact editorial layout, fluid on every device */
          html, body {
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
          }

          header {
            width: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            padding: 19px 0 0 !important;
            border: 0 !important;
            outline: 0 !important;
            box-shadow: none !important;
            box-sizing: border-box !important;
            background: #fbf9f8 !important;
          }

          /* The logo/search/contact content keeps the Home reference margins. */
          header > div {
            width: min(83vw, 1696px) !important;
            max-width: none !important;
            margin: 0 auto !important;
            padding: 0 !important;
            box-sizing: border-box !important;
          }

          /* Logo/search/contact row */
          header > div > div:first-child {
            position: relative !important;
            width: 100% !important;
            min-height: 51px !important;
            height: 51px !important;
            margin: 0 0 33px !important;
            padding: 0 !important;
            border: 0 !important;
            box-shadow: none !important;
            box-sizing: border-box !important;
          }

          header > div > div:first-child > a:first-of-type,
          header .epl-site-title {
            position: absolute !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: auto !important;
            max-width: calc(100% - 260px) !important;
            margin: 0 !important;
            padding: 0 !important;
            text-align: center !important;
            white-space: nowrap !important;
            overflow: visible !important;
            text-overflow: clip !important;
            font-family: 'Playfair Display', Georgia, serif !important;
            font-size: clamp(30px, 3.15vw, 48px) !important;
            font-weight: 700 !important;
            line-height: 1 !important;
            letter-spacing: -0.035em !important;
            color: #000 !important;
            z-index: 2 !important;
          }

          header > div > div:first-child > div:last-child {
            position: absolute !important;
            right: 0 !important;
            top: 0 !important;
            height: 51px !important;
            display: flex !important;
            align-items: center !important;
            gap: 24px !important;
            z-index: 4 !important;
          }

          header > div > div:first-child > div:first-child {
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
            height: 51px !important;
            display: flex !important;
            align-items: center !important;
            z-index: 4 !important;
          }

          header > div > div:first-child .material-symbols-outlined {
            font-size: 29px !important;
            line-height: 1 !important;
          }

          header > div > div:first-child button:not(.md\\:hidden) {
            min-width: 159px !important;
            height: 51px !important;
            padding: 0 28px !important;
            border: 0 !important;
            border-radius: 0 !important;
            background: #000 !important;
            color: #fff !important;
            box-sizing: border-box !important;
          }

          /* Navigation lines are full viewport width on every device. */
          header nav {
            display: flex !important;
            position: relative !important;
            width: 100vw !important;
            max-width: none !important;
            min-height: 59px !important;
            margin-left: calc(50% - 50vw) !important;
            margin-right: calc(50% - 50vw) !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            padding: 7px 0 13px !important;
            border-top: 2px solid #b8b8b8 !important;
            border-bottom: 2px solid #b8b8b8 !important;
            border-left: 0 !important;
            border-right: 0 !important;
            box-sizing: border-box !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 68px !important;
            overflow-x: auto !important;
            scrollbar-width: none !important;
            white-space: nowrap !important;
          }

          header nav::-webkit-scrollbar { display: none !important; }
          header nav a { flex: 0 0 auto !important; }

          header nav a.border-b-2 {
            border-bottom-width: 2px !important;
            padding-bottom: 7px !important;
          }

          @media (max-width: 767px) {
            header {
              padding-top: 12px !important;
            }
            header > div {
              width: calc(100% - 40px) !important;
            }
            header > div > div:first-child {
              min-height: 42px !important;
              height: 42px !important;
              margin-bottom: 14px !important;
            }
            header > div > div:first-child > a:first-of-type,
            header .epl-site-title {
              max-width: calc(100% - 120px) !important;
              font-size: clamp(21px, 7vw, 30px) !important;
              letter-spacing: -0.03em !important;
            }
            header > div > div:first-child > div:last-child {
              height: 42px !important;
              gap: 10px !important;
            }
            header > div > div:first-child > div:first-child {
              height: 42px !important;
            }
            header > div > div:first-child button:not(.md\\:hidden) {
              min-width: 0 !important;
              width: 42px !important;
              height: 42px !important;
              padding: 0 !important;
            }
            header nav {
              width: 100vw !important;
              margin-left: calc(50% - 50vw) !important;
              margin-right: calc(50% - 50vw) !important;
              min-height: 52px !important;
              padding: 6px 8px 10px !important;
              justify-content: flex-start !important;
              gap: 30px !important;
            }
          }

          @media (min-width: 768px) and (max-width: 1100px) {
            header > div {
              width: calc(100% - 80px) !important;
            }
            header nav { gap: 42px !important; }
            header > div > div:first-child > a:first-of-type,
            header .epl-site-title {
              max-width: calc(100% - 220px) !important;
              font-size: clamp(27px, 4vw, 40px) !important;
            }
          }
          '''

          old_markers = (
              'EPL shared header',
              'EPL full-bleed shell',
              'EPL navigation dividers',
              'EPL FINAL HEADER',
              'EPL HEADER — exact editorial layout'
          )
          style_pattern = re.compile(r'<style\b[^>]*>.*?</style>\s*', re.I | re.S)

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')

              text = style_pattern.sub(
                  lambda m: '' if any(marker in m.group(0) for marker in old_markers) else m.group(0),
                  text
              )

              text = re.sub(
                  r'(<a\b[^>]*href="/"[^>]*>)\s*<a\b[^>]*>\s*Economic policy lab\s*</a>\s*</a>',
                  r'\1Economic Policy Lab</a>',
                  text,
                  flags=re.I | re.S,
              )

              text = text.replace('</head>', '<style>\n' + final_css + '\n</style>\n</head>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit header changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/expanded-articles.html research/index.html articles/index.html team/index.html join/index.html
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
            exit 0
          fi
          git commit -m "Standardize full-width EPL navigation lines"
          git push