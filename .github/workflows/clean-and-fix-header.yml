name: Clean and fix EPL header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply one consistent responsive EPL header
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('home/expanded-articles.html'),
              Path('research/index.html'),
              Path('articles/index.html'),
              Path('team/index.html'),
              Path('join/index.html'),
          ]

          final_css = r'''
          /* EPL HEADER — match the Research page exactly */
          html, body {
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
          }

          header {
            border: 0 !important;
            outline: 0 !important;
            box-shadow: none !important;
            width: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
            background: #fbf9f8 !important;
          }

          /* Same horizontal header padding as Research: 20px mobile / 48px desktop. */
          header > div {
            width: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            padding-left: 48px !important;
            padding-right: 48px !important;
            box-sizing: border-box !important;
          }

          /* Research reference: title row ends only 5px before the nav line. */
          header > div > div:first-child {
            position: relative !important;
            width: 100% !important;
            min-height: 53px !important;
            height: 53px !important;
            margin: 0 0 5px !important;
            padding: 0 !important;
            border: 0 !important;
            box-shadow: none !important;
            box-sizing: border-box !important;
          }

          header > div > div:first-child > a:first-of-type,
          header .epl-site-title {
            position: absolute !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: min(68vw, 760px) !important;
            max-width: calc(100% - 220px) !important;
            margin: 0 !important;
            padding: 0 !important;
            text-align: center !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            font-family: 'Playfair Display', Georgia, serif !important;
            font-size: clamp(22px, 4vw, 48px) !important;
            font-weight: 700 !important;
            line-height: 1 !important;
            letter-spacing: -0.035em !important;
            color: #000 !important;
            z-index: 2 !important;
          }

          header > div > div:first-child > div:last-child {
            position: absolute !important;
            right: 0 !important;
            top: 0 !important;
            height: 53px !important;
            display: flex !important;
            align-items: center !important;
            gap: 16px !important;
            z-index: 4 !important;
          }

          header > div > div:first-child > div:first-child {
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
            height: 53px !important;
            display: flex !important;
            align-items: center !important;
            z-index: 4 !important;
          }

          header > div > div:first-child .material-symbols-outlined {
            font-size: 29px !important;
            line-height: 1 !important;
          }

          /* Navigation lines: full viewport width, including phone/tablet. */
          header nav {
            display: flex !important;
            position: relative !important;
            z-index: 3 !important;
            width: 100vw !important;
            max-width: none !important;
            min-height: 59px !important;
            margin-left: calc(50% - 50vw) !important;
            margin-right: calc(50% - 50vw) !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            padding: 5px 0 12px !important;
            border-top: 2px solid #b8b8b8 !important;
            border-bottom: 2px solid #b8b8b8 !important;
            border-left: 0 !important;
            border-right: 0 !important;
            box-sizing: border-box !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 32px !important;
            overflow-x: auto !important;
            scrollbar-width: none !important;
            white-space: nowrap !important;
          }

          header nav::-webkit-scrollbar { display: none !important; }
          header nav a { flex: 0 0 auto !important; }

          header nav a.border-b-2 {
            border-bottom-width: 2px !important;
            padding-bottom: 4px !important;
          }

          @media (max-width: 767px) {
            header > div {
              padding-left: 20px !important;
              padding-right: 20px !important;
            }

            header > div > div:first-child {
              min-height: 36px !important;
              height: 36px !important;
              margin-bottom: 5px !important;
            }

            header > div > div:first-child > a:first-of-type,
            header .epl-site-title {
              width: 78vw !important;
              max-width: calc(100% - 92px) !important;
              font-size: clamp(19px, 7vw, 30px) !important;
              letter-spacing: -0.03em !important;
            }

            header > div > div:first-child > div:last-child,
            header > div > div:first-child > div:first-child {
              height: 36px !important;
            }

            header nav {
              width: 100vw !important;
              margin-left: calc(50% - 50vw) !important;
              margin-right: calc(50% - 50vw) !important;
              min-height: 52px !important;
              padding: 5px 8px 10px !important;
              justify-content: flex-start !important;
              gap: 30px !important;
            }
          }

          @media (min-width: 768px) and (max-width: 1100px) {
            header > div {
              padding-left: 40px !important;
              padding-right: 40px !important;
            }

            header > div > div:first-child > a:first-of-type,
            header .epl-site-title {
              max-width: calc(100% - 190px) !important;
            }
          }
          '''

          old_markers = (
              'EPL shared header',
              'EPL full-bleed shell',
              'EPL navigation dividers',
              'EPL FINAL HEADER',
              'EPL HEADER — exact editorial layout',
              'EPL HEADER — match the Research page exactly'
          )
          style_pattern = re.compile(r'<style\b[^>]*>.*?</style>\s*', re.I | re.S)

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text(encoding='utf-8')
              text = style_pattern.sub(
                  lambda m: '' if any(marker in m.group(0) for marker in old_markers) else m.group(0),
                  text
              )

              text = re.sub(
                  r'(<a\b[^>]*href="/"[^>]*>)\s*<a\b[^>]*>\s*Economic policy lab\s*</a>\s*</a>',
                  r'\1Economic Policy Lab</a>',
                  text,
                  flags=re.I | re.S,
              )

              text = text.replace('</head>', '<style>\n' + final_css + '\n</style>\n</head>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit header changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/expanded-articles.html research/index.html articles/index.html team/index.html join/index.html
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
            exit 0
          fi
          git commit -m "Match all EPL headers to Research spacing"
          git push
