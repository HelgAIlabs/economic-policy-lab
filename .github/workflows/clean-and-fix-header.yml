name: Copy working EPL header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the known-good Team header to Home and Articles
        shell: python
        run: |
          from pathlib import Path
          import re

          team = Path('team/index.html').read_text(encoding='utf-8')
          header_match = re.search(r'<header\b[\s\S]*?</header>', team, re.I)
          if not header_match:
              raise SystemExit('Could not find the known-good Team header')

          # Older Team versions had a dedicated marker around the header CSS,
          # but the current Team page keeps that CSS in its normal head style.
          # The header itself is the source of truth; CSS replacement is only
          # attempted when the legacy marker exists in both source and target.
          style_match = re.search(
              r'<style>\s*/\* EPL HEADER — match the Research page exactly \*/[\s\S]*?</style>',
              team,
              re.I,
          )
          base_style = style_match.group(0) if style_match else None

          normal_class = (
              'font-label-sm text-label-sm uppercase tracking-wider '
              'text-on-surface-variant dark:text-on-tertiary-container '
              'hover:text-primary dark:hover:text-on-surface '
              'hover:bg-surface-container-low dark:hover:bg-tertiary-container '
              'transition-colors py-2 px-3'
          )
          active_class = (
              'font-label-sm text-label-sm uppercase tracking-wider '
              'text-secondary dark:text-secondary-container border-b-2 '
              'border-secondary dark:border-secondary-container pb-1 '
              'hover:bg-surface-container-low dark:hover:bg-tertiary-container '
              'transition-colors px-3'
          )

          def make_header(active_href):
              h = header_match.group(0)
              nav_match = re.search(r'<nav\b[\s\S]*?</nav>', h, re.I)
              if not nav_match:
                  raise SystemExit('Could not find navigation in Team header')
              nav = nav_match.group(0)

              # Normalize Team's active state first.
              nav = re.sub(
                  r'<a class="[^"]*" href="/team">',
                  f'<a class="{normal_class}" href="/team">',
                  nav,
                  count=1,
              )
              nav = re.sub(
                  rf'<a class="[^"]*" href="{re.escape(active_href)}">',
                  f'<a class="{active_class}" href="{active_href}">',
                  nav,
                  count=1,
              )
              return h[:nav_match.start()] + nav + h[nav_match.end():]

          targets = {
              Path('home/expanded-articles.html'): '/',
              Path('articles/index.html'): '/articles',
          }

          for path, active_href in targets.items():
              if not path.exists():
                  raise SystemExit(f'Missing target: {path}')

              text = path.read_text(encoding='utf-8')

              if base_style:
                  text, style_count = re.subn(
                      r'<style>\s*/\* EPL HEADER — match the Research page exactly \*/[\s\S]*?</style>',
                      base_style,
                      text,
                      count=1,
                      flags=re.I,
                  )
                  if style_count not in (0, 1):
                      raise SystemExit(f'Unexpected header CSS matches in {path}')

              text, header_count = re.subn(
                  r'<header\b[\s\S]*?</header>',
                  make_header(active_href),
                  text,
                  count=1,
                  flags=re.I,
              )
              if header_count != 1:
                  raise SystemExit(f'Could not replace header in {path}')

              text = re.sub(
                  r'<style id="epl-header-overlap-fix">[\s\S]*?</style>\s*',
                  '',
                  text,
                  flags=re.I,
              )

              path.write_text(text, encoding='utf-8')

      - name: Commit copied headers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/expanded-articles.html articles/index.html
          if git diff --cached --quiet; then
            echo "No header changes needed"
            exit 0
          fi
          git commit -m "Fix Home header active navigation underline"
          git push
