name: Copy working EPL header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the known-good Team header to Home and Articles
        shell: python
        run: |
          from pathlib import Path
          import re

          team = Path('team/index.html').read_text(encoding='utf-8')
          header_match = re.search(r'<header\b[\s\S]*?</header>', team, re.I)
          style_match = re.search(
              r'<style>\s*/\* EPL HEADER — match the Research page exactly \*/[\s\S]*?</style>',
              team,
              re.I,
          )

          if not header_match or not style_match:
              raise SystemExit('Could not find the known-good Team header/style')

          base_header = header_match.group(0)
          base_style = style_match.group(0)

          normal_class = (
              'font-label-sm text-label-sm uppercase tracking-wider '
              'text-on-surface-variant dark:text-on-tertiary-container '
              'hover:text-primary dark:hover:text-on-surface '
              'hover:bg-surface-container-low dark:hover:bg-tertiary-container '
              'transition-colors py-2 px-3'
          )
          active_class = (
              'font-label-sm text-label-sm uppercase tracking-wider '
              'text-secondary dark:text-secondary-container border-b-2 '
              'border-secondary dark:border-secondary-container pb-1 '
              'hover:bg-surface-container-low dark:hover:bg-tertiary-container '
              'transition-colors px-3'
          )

          def make_header(active_href):
              h = base_header
              # Remove Team's active state first.
              h = re.sub(
                  r'<a class="[^"]*" href="/team">',
                  f'<a class="{normal_class}" href="/team">',
                  h,
                  count=1,
              )
              # Apply the active state to the requested page.
              h = re.sub(
                  rf'<a class="[^"]*" href="{re.escape(active_href)}">',
                  f'<a class="{active_class}" href="{active_href}">',
                  h,
                  count=1,
              )
              return h

          targets = {
              Path('home/expanded-articles.html'): '/',
              Path('articles/index.html'): '/articles',
          }

          for path, active_href in targets.items():
              if not path.exists():
                  raise SystemExit(f'Missing target: {path}')

              text = path.read_text(encoding='utf-8')

              # Remove any previous header patch and install the exact working
              # header CSS from Team, rather than stacking another override.
              text, style_count = re.subn(
                  r'<style>\s*/\* EPL HEADER — match the Research page exactly \*/[\s\S]*?</style>',
                  base_style,
                  text,
                  count=1,
                  flags=re.I,
              )
              if style_count != 1:
                  raise SystemExit(f'Could not replace EPL header CSS in {path}')

              # Replace the entire header, fixing malformed/nested markup at once.
              text, header_count = re.subn(
                  r'<header\b[\s\S]*?</header>',
                  make_header(active_href),
                  text,
                  count=1,
                  flags=re.I,
              )
              if header_count != 1:
                  raise SystemExit(f'Could not replace header in {path}')

              # Delete the old geometry patch if it is still present.
              text = re.sub(
                  r'<style id="epl-header-overlap-fix">[\s\S]*?</style>\s*',
                  '',
                  text,
                  flags=re.I,
              )

              path.write_text(text, encoding='utf-8')

      - name: Commit copied headers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/expanded-articles.html articles/index.html
          if git diff --cached --quiet; then
            echo "No header changes needed"
            exit 0
          fi
          git commit -m "Use working Team header on Home and Articles"
          git push
