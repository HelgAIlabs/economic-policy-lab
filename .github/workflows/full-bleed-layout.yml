name: EPL full-bleed header and footer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make header and footer full width
        shell: python
        run: |
          from pathlib import Path
          css = r'''
          /* EPL full-bleed shell: header and footer reach both viewport edges */
          html, body { margin: 0 !important; padding: 0 !important; max-width: none !important; overflow-x: hidden !important; }
          header, footer {
            width: 100% !important;
            max-width: none !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
            box-sizing: border-box !important;
          }
          header > div, footer > div {
            box-sizing: border-box !important;
          }
          @media (max-width: 767px) {
            header > div, footer > div { padding-left: 20px !important; padding-right: 20px !important; }
          }
          '''
          marker = '/* EPL full-bleed shell: header and footer reach both viewport edges */'
          files = [Path('home/expanded-articles.html'), Path('research/index.html'), Path('articles/index.html'), Path('team/index.html'), Path('join/index.html')]
          for path in files:
              if not path.exists(): continue
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  text = text.replace('</head>', '<style>\n' + css + '\n</style>\n</head>', 1)
                  path.write_text(text, encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/expanded-articles.html research/index.html articles/index.html team/index.html join/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make shared header and footer full width"
          git push
