name: Normalize EPL Header
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive centered header
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('home/expanded-articles.html'),
              Path('research/index.html'),
              Path('articles/index.html'),
              Path('team/index.html'),
              Path('join/index.html'),
          ]

          css = '''
          /* EPL shared header: centered, bounded, responsive */
          header > div > div:first-child { position: relative; min-height: 48px; }
          .epl-site-title {
            position: absolute !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: min(62vw, 720px) !important;
            max-width: calc(100% - 220px) !important;
            text-align: center !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            font-size: clamp(22px, 4vw, 48px) !important;
            line-height: 1 !important;
            z-index: 2;
          }
          @media (max-width: 767px) {
            header > div { padding-left: 20px !important; padding-right: 20px !important; }
            .epl-site-title {
              width: 78vw !important;
              max-width: calc(100% - 92px) !important;
              font-size: clamp(19px, 7vw, 30px) !important;
            }
          }
          @media (min-width: 768px) and (max-width: 1100px) {
            .epl-site-title { max-width: calc(100% - 190px) !important; }
          }
          @media (min-width: 768px) {
            header nav { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
            header nav::-webkit-scrollbar { display: none; }
          }
          '''

          js = '''
          <script>
          document.addEventListener('DOMContentLoaded', function () {
            const titles = Array.from(document.querySelectorAll('header a')).filter(function (a) {
              return a.textContent.trim().toLowerCase() === 'economic policy lab';
            });
            const title = titles[titles.length - 1];
            if (title) {
              title.classList.add('epl-site-title');
              title.setAttribute('href', '/home/expanded-articles.html');
            }
          });
          </script>
          '''

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if '/* EPL shared header: centered, bounded, responsive */' not in text:
                  text = text.replace('</head>', '<style>\n' + css + '\n</style>\n</head>', 1)
              if "title.classList.add('epl-site-title')" not in text:
                  text = text.replace('</body>', js + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/expanded-articles.html research/index.html articles/index.html team/index.html join/index.html
          git diff --cached --quiet || git commit -m "Normalize responsive centered header"
          git push
