name: Fix EPL header spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply shared responsive header fix
        shell: python
        run: |
          from pathlib import Path

          css = r'''
          /* EPL shared header: centered title with a clear line underneath */
          header > div > div:first-child {
            position: relative !important;
            min-height: 72px !important;
            margin-bottom: 0 !important;
            align-items: center !important;
          }

          header > div > div:first-child > a:first-of-type {
            position: absolute !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: min(68vw, 760px) !important;
            max-width: calc(100% - 220px) !important;
            margin: 0 !important;
            padding: 0 !important;
            text-align: center !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            font-size: clamp(28px, 4vw, 48px) !important;
            line-height: 1 !important;
            z-index: 2 !important;
          }

          header nav {
            position: relative !important;
            z-index: 1 !important;
            border-top: 1px solid #E0E0E0 !important;
            padding-top: 14px !important;
            margin-top: 0 !important;
          }

          @media (max-width: 767px) {
            header > div {
              padding-left: 20px !important;
              padding-right: 20px !important;
            }
            header > div > div:first-child {
              min-height: 52px !important;
            }
            header > div > div:first-child > a:first-of-type {
              width: 78vw !important;
              max-width: calc(100% - 92px) !important;
              font-size: clamp(19px, 7vw, 30px) !important;
            }
          }

          @media (min-width: 768px) and (max-width: 1100px) {
            header > div > div:first-child > a:first-of-type {
              max-width: calc(100% - 190px) !important;
            }
          }
          '''

          marker = '/* EPL shared header: centered title with a clear line underneath */'
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              insertion = f'<style>\n{css}\n</style>\n'
              if '</head>' not in text:
                  continue
              text = text.replace('</head>', insertion + '</head>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit header fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
            exit 0
          fi
          git commit -m "Fix header line placement across pages"
          git push
