<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Economic Policy Lab</title>
  <meta name="description" content="Economic Policy Lab — research, articles, and evidence-based policy perspectives.">
  <style>
    html,body{margin:0;min-height:100%;background:#fbf9f8}
    .root-loading{min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;color:#444}
  </style>
</head>
<body>
  <div class="root-loading">Loading Economic Policy Lab…</div>
  <script>
    fetch('/home/expanded-articles.html', { credentials: 'same-origin' })
      .then(function (response) {
        if (!response.ok) throw new Error('Homepage request failed: ' + response.status);
        return response.text();
      })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        document.body.innerHTML = '<main style="font:16px system-ui,sans-serif;padding:40px">Unable to load the homepage. Please refresh.</main>';
      });
  </script>
</body>
</html>
