<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Area - Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#fbf9f8] text-[#1b1c1c]"><main class="max-w-6xl mx-auto px-5 md:px-12 py-10"><header class="flex flex-col md:flex-row md:justify-between gap-5 items-start border-b pb-7"><div><a href="/" class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">Economic Policy Lab</a><h1 class="font-serif text-4xl md:text-5xl font-bold mt-4">Member area</h1><p id="identity" class="text-gray-600 mt-2"></p></div><div class="flex gap-3"><a href="/member/write" class="bg-black text-white px-5 py-3 text-sm uppercase tracking-wider">New submission</a><button id="logout" class="border px-5 py-3 text-sm">Log out</button></div></header><section class="py-10"><div class="flex items-end justify-between mb-5"><div><p class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">Contributor workspace</p><h2 class="font-serif text-3xl font-bold mt-2">My submissions</h2></div></div><div id="articles" class="border bg-white"><p class="p-6 text-gray-500">Loading…</p></div></section></main><script type="module">import{supabase}from'../supabase-client.js';const identity=document.querySelector('#identity'),list=document.querySelector('#articles'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='/auth/';throw new Error('no session')}const{data:isAdmin,error:adminError}=await supabase.rpc('is_admin');if(!adminError&&isAdmin===true){location.href='/admin';throw new Error('admin session')}const{data:profile}=await supabase.from('profiles').select('role,display_name').eq('id',session.user.id).maybeSingle();if(profile?.role==='admin'){location.href='/admin';throw new Error('admin session')}identity.textContent=profile?.display_name||session.user.email;document.querySelector('#logout').onclick=async()=>{await supabase.auth.signOut();location.href='/auth/'};const{data,error}=await supabase.from('articles').select('id,title,author_name,status,content_type,created_at,updated_at').eq('author_id',session.user.id).order('updated_at',{ascending:false});if(error){list.innerHTML='<p class="p-6 text-red-700">Could not load submissions: '+esc(error.message)+'</p>'}else if(!data?.length){list.innerHTML='<div class="p-10 text-center"><p class="font-serif text-xl">No submissions yet.</p><p class="text-gray-500 mt-2">Create an article or research submission.</p></div>'}else{list.innerHTML=data.map(a=>`<article class="p-5 md:p-6 border-b last:border-b-0 flex flex-col md:flex-row md:items-center justify-between gap-4"><div><div class="flex gap-2 items-center"><span class="text-xs uppercase tracking-wider border px-2 py-1">${a.content_type==='research'?'Research':'Article'}</span><span class="text-xs uppercase tracking-wider border px-2 py-1">${esc(a.status)}</span></div><h3 class="font-serif text-xl font-bold mt-3">${esc(a.title||'Untitled')}</h3><p class="text-sm text-gray-600 mt-1">Author: ${esc(a.author_name||'EPL Member')}</p></div><a class="border px-4 py-2 text-sm text-center" href="/member/write?id=${encodeURIComponent(a.id)}">Edit</a></article>`).join('')}</script></body></html>
