<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write an Article - Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script><style>[contenteditable]{outline:none}.editor p{margin:1em 0}.editor h2{font:700 1.5rem Georgia,serif;margin:1.2em 0 .5em}.editor blockquote{border-left:3px solid #af2b3e;padding-left:1rem;color:#555}.editor a{color:#af2b3e;text-decoration:underline}.editor img{max-width:100%;height:auto;margin:1rem 0}</style></head>
<body class="bg-[#fbf9f8] text-[#1b1c1c]"><main class="max-w-5xl mx-auto px-5 md:px-12 py-10"><header class="flex justify-between items-start border-b pb-6"><div><a href="/member" class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">← Member area</a><h1 class="font-serif text-4xl md:text-5xl font-bold mt-5">Write an article</h1><p class="text-gray-600 mt-2">Prepare your article for editorial review.</p></div><a href="/" class="text-sm underline">EPL home</a></header>
<div id="message" class="hidden mt-6 p-4 border"></div><form id="form" class="mt-8 space-y-6"><section class="bg-white border p-6 md:p-8 space-y-5"><label class="block text-sm font-semibold">Author name<input id="author_name" required maxlength="120" placeholder="Name displayed to readers" class="mt-2 w-full border p-3 text-base font-normal"></label><label class="block text-sm font-semibold">Article title<input id="title" required maxlength="240" placeholder="Your article title" class="mt-2 w-full border p-3 text-xl font-serif font-normal"></label><label class="block text-sm font-semibold">Excerpt / abstract<textarea id="excerpt" rows="3" maxlength="1000" placeholder="A short description for the Articles page" class="mt-2 w-full border p-3 font-normal"></textarea></label><div><label class="block text-sm font-semibold mb-2">Cover image</label><div class="flex flex-wrap items-center gap-3"><input id="cover" type="file" accept="image/*" class="text-sm"><span id="cover-status" class="text-xs text-gray-500"></span></div><img id="cover-preview" class="hidden mt-4 max-h-64 object-cover" alt="Cover preview"></div><label class="block text-sm font-semibold">Category<input id="category" maxlength="80" placeholder="e.g. Monetary Policy, Development Economics" class="mt-2 w-full border p-3 font-normal"></label></section>
<section class="bg-white border"><div class="px-6 md:px-8 pt-6"><label class="block text-sm font-semibold mb-2">Article body</label><div class="flex flex-wrap gap-1 border border-b-0 bg-[#f6f4f2] p-2" id="toolbar"><button type="button" data-cmd="bold" class="px-3 py-2 border bg-white font-bold">B</button><button type="button" data-cmd="italic" class="px-3 py-2 border bg-white italic">I</button><button type="button" data-cmd="underline" class="px-3 py-2 border bg-white underline">U</button><button type="button" data-cmd="formatBlock" data-value="h2" class="px-3 py-2 border bg-white">Heading</button><button type="button" data-cmd="insertUnorderedList" class="px-3 py-2 border bg-white">• List</button><button type="button" data-cmd="insertOrderedList" class="px-3 py-2 border bg-white">1. List</button><button type="button" id="link-btn" class="px-3 py-2 border bg-white">Link</button><button type="button" id="image-btn" class="px-3 py-2 border bg-white">Add image</button><button type="button" id="quote-btn" class="px-3 py-2 border bg-white">Quote</button><input id="image-file" type="file" accept="image/*" class="hidden"></div><div id="editor" class="editor min-h-[420px] border p-5 md:p-7 text-lg leading-8" contenteditable="true" data-placeholder="Start writing your article…"></div><p class="text-xs text-gray-500 px-1 py-3">Use the toolbar for bold, italic, underline, headings, lists, links, quotes, and images. Images are uploaded to EPL's Supabase storage.</p></div></section>
<div class="flex flex-wrap justify-between gap-3"><a href="/member" class="border px-5 py-3 text-sm">Cancel</a><div class="flex gap-3"><button type="button" id="draft" class="border border-black px-5 py-3 text-sm font-semibold">Save draft</button><button type="submit" class="bg-black text-white px-6 py-3 text-sm uppercase tracking-wider font-semibold">Submit for review</button></div></div></form></main>
<script type="module">import {supabase} from '../../supabase-client.js'; const $=s=>document.querySelector(s),msg=$('#message'),editor=$('#editor');let session,currentId=new URLSearchParams(location.search).get('id');let savedRange=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function show(t,ok=false){msg.textContent=t;msg.className='mt-6 p-4 border '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50');}
const {data:{session:s}}=await supabase.auth.getSession();session=s;if(!session)location.href='/auth/';const {data:profile}=await supabase.from('profiles').select('role').eq('id',session.user.id).single();if(profile?.role==='admin')location.href='/admin';
async function load(){if(!currentId)return;const {data,error}=await supabase.from('articles').select('*').eq('id',currentId).eq('author_id',session.user.id).single();if(error||!data){show('Article could not be loaded.');return}if(data.status==='published'){show('Published articles cannot be edited from the member area. Contact an editor if a correction is needed.');return}$('#author_name').value=data.author_name||'';$('#title').value=data.title||'';$('#excerpt').value=data.excerpt||'';$('#category').value=data.category||'';editor.innerHTML=data.content||'';if(data.cover_image_url){$('#cover-preview').src=data.cover_image_url;$('#cover-preview').classList.remove('hidden');}}
load();
function keep(){const sel=getSelection();if(sel?.rangeCount)savedRange=sel.getRangeAt(0).cloneRange();}editor.addEventListener('keyup',keep);editor.addEventListener('mouseup',keep);$('#toolbar').addEventListener('mousedown',e=>e.preventDefault());document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{editor.focus();document.execCommand(b.dataset.cmd,false,b.dataset.value||null);});$('#link-btn').onclick=()=>{editor.focus();const url=prompt('Paste the URL:');if(url)document.execCommand('createLink',false,url);};$('#quote-btn').onclick=()=>{editor.focus();document.execCommand('formatBlock',false,'blockquote');};
async function uploadImage(file){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${session.user.id}/${crypto.randomUUID()}.${ext}`;const {error}=await supabase.storage.from('article-images').upload(path,file,{contentType:file.type,upsert:false});if(error){show(error.message);return null}return supabase.storage.from('article-images').getPublicUrl(path).data.publicUrl;}
$('#image-btn').onclick=()=>$('#image-file').click();$('#image-file').onchange=async e=>{const url=await uploadImage(e.target.files[0]);if(url){editor.focus();document.execCommand('insertImage',false,url);}};$('#cover').onchange=async e=>{const file=e.target.files[0];if(!file)return;$('#cover-status').textContent='Uploading…';const url=await uploadImage(file);if(url){$('#cover-preview').src=url;$('#cover-preview').classList.remove('hidden');$('#cover-preview').dataset.url=url;$('#cover-status').textContent='Uploaded';}else $('#cover-status').textContent='Upload failed';};
async function save(status){const author=$('#author_name').value.trim(),title=$('#title').value.trim(),content=editor.innerHTML.trim();if(!author||!title||!editor.innerText.trim())return show('Please enter an author name, title, and article body.');const cover=$('#cover-preview').dataset.url||$('#cover-preview').src||null;const payload={author_id:session.user.id,author_name:author,title,excerpt:$('#excerpt').value.trim(),content,category:$('#category').value.trim(),cover_image_url:cover,status,updated_at:new Date().toISOString()};let result;if(currentId)result=await supabase.from('articles').update(payload).eq('id',currentId).eq('author_id',session.user.id);else result=await supabase.from('articles').insert(payload);if(result.error)return show(result.error.message);show(status==='draft'?'Draft saved.':'Submitted for editorial review.',true);if(status==='pending')setTimeout(()=>location.href='/member',700);else if(!currentId&&result.data?.[0]?.id)currentId=result.data[0].id;}
$('#draft').onclick=()=>save('draft');$('#form').onsubmit=e=>{e.preventDefault();save('pending');};</script></body></html>
