<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write for EPL</title><script src="https://cdn.tailwindcss.com"></script><style>[contenteditable]{outline:none}.editor p{margin:1em 0}.editor h2{font:700 1.5rem Georgia,serif;margin:1.2em 0 .5em}.editor blockquote{border-left:3px solid #af2b3e;padding-left:1rem;color:#555}.editor a{color:#af2b3e;text-decoration:underline}.editor img{max-width:100%;height:auto;margin:1rem 0}</style></head><body class="bg-[#fbf9f8] text-[#1b1c1c]"><main class="max-w-5xl mx-auto px-5 md:px-12 py-10"><header class="flex justify-between items-start border-b pb-6"><div><a href="/member" class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">← Member area</a><h1 class="font-serif text-4xl md:text-5xl font-bold mt-5">Create a submission</h1><p id="subhead" class="text-gray-600 mt-2">Prepare your article for editorial review.</p></div><a href="/" class="text-sm underline">EPL home</a></header><div id="message" class="hidden mt-6 p-4 border"></div><form id="form" class="mt-8 space-y-6"><section class="bg-white border p-6 md:p-8 space-y-5"><div><label class="block text-sm font-semibold">Content type</label><div class="grid sm:grid-cols-2 gap-3 mt-2"><label class="border p-4 cursor-pointer"><input type="radio" name="content_type" value="article" checked> <strong>Article</strong><span class="block text-sm text-gray-500 mt-1">Opinion, commentary, analysis, or feature.</span></label><label class="border p-4 cursor-pointer"><input type="radio" name="content_type" value="research"> <strong>Research</strong><span class="block text-sm text-gray-500 mt-1">Research paper, study, report, or working paper.</span></label></div></div><label class="block text-sm font-semibold">Author name<input id="author_name" required maxlength="120" placeholder="Name displayed to readers" class="mt-2 w-full border p-3 text-base font-normal"></label><label class="block text-sm font-semibold"><span id="title-label">Article title</span><input id="title" required maxlength="240" placeholder="Title" class="mt-2 w-full border p-3 text-xl font-serif font-normal"></label><label class="block text-sm font-semibold">Abstract / excerpt<textarea id="excerpt" rows="3" maxlength="2000" placeholder="A short description" class="mt-2 w-full border p-3 font-normal"></textarea></label><div><label class="block text-sm font-semibold mb-2">Cover image</label><input id="cover" type="file" accept="image/*" class="text-sm"><span id="cover-status" class="text-xs text-gray-500 ml-2"></span><img id="cover-preview" class="hidden mt-4 max-h-64 object-cover" alt="Cover preview"></div><label class="block text-sm font-semibold">Category<input id="category" maxlength="80" placeholder="e.g. Monetary Policy, Development Economics" class="mt-2 w-full border p-3 font-normal"></label></section><section class="bg-white border"><div class="px-6 md:px-8 pt-6"><label class="block text-sm font-semibold mb-2"><span id="body-label">Article body</span></label><div class="flex flex-wrap gap-1 border border-b-0 bg-[#f6f4f2] p-2" id="toolbar"><button type="button" data-cmd="bold" class="px-3 py-2 border bg-white font-bold">B</button><button type="button" data-cmd="italic" class="px-3 py-2 border bg-white italic">I</button><button type="button" data-cmd="underline" class="px-3 py-2 border bg-white underline">U</button><button type="button" data-cmd="formatBlock" data-value="h2" class="px-3 py-2 border bg-white">Heading</button><button type="button" data-cmd="insertUnorderedList" class="px-3 py-2 border bg-white">• List</button><button type="button" data-cmd="insertOrderedList" class="px-3 py-2 border bg-white">1. List</button><button type="button" id="link-btn" class="px-3 py-2 border bg-white">Link</button><button type="button" id="image-btn" class="px-3 py-2 border bg-white">Add image</button><button type="button" id="quote-btn" class="px-3 py-2 border bg-white">Quote</button><input id="image-file" type="file" accept="image/*" class="hidden"></div><div id="editor" class="editor min-h-[420px] border p-5 md:p-7 text-lg leading-8" contenteditable="true"></div><p class="text-xs text-gray-500 px-1 py-3">Use the toolbar for formatting, links, quotes, and images.</p></div></section><div class="flex flex-wrap justify-between gap-3"><a href="/member" class="border px-5 py-3 text-sm">Cancel</a><div class="flex gap-3"><button type="button" id="draft" class="border border-black px-5 py-3 text-sm font-semibold">Save draft</button><button type="submit" class="bg-black text-white px-6 py-3 text-sm uppercase tracking-wider font-semibold">Submit for review</button></div></div></form></main><script type="module">import{supabase}from'../../supabase-client.js';const $=s=>document.querySelector(s),msg=$('#message'),editor=$('#editor');let session,currentId=new URLSearchParams(location.search).get('id');const {data:{session:s}}=await supabase.auth.getSession();session=s;if(!session)location.href='/auth/';const {data:profile}=await supabase.from('profiles').select('role').eq('id',session.user.id).single();if(profile?.role==='admin')location.href='/admin';function show(t,ok=false){msg.textContent=t;msg.className='mt-6 p-4 border '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50')}function type(){return document.querySelector('input[name=content_type]:checked').value}function updateLabels(){const r=type()==='research';$('#subhead').textContent=r?'Prepare your research for editorial review.':'Prepare your article for editorial review.';$('#title-label').textContent=r?'Research title':'Article title';$('#body-label').textContent=r?'Research body':'Article body'}document.querySelectorAll('input[name=content_type]').forEach(x=>x.onchange=updateLabels);updateLabels();async function load(){if(!currentId)return;const {data,error}=await supabase.from('articles').select('*').eq('id',currentId).eq('author_id',session.user.id).single();if(error||!data)return show('Submission could not be loaded.');if(data.status==='published')return show('Published submissions cannot be edited here.');document.querySelector(`input[name=content_type][value="${data.content_type||'article'}"]`).checked=true;updateLabels();$('#author_name').value=data.author_name||'';$('#title').value=data.title||'';$('#excerpt').value=data.excerpt||'';$('#category').value=data.category||'';editor.innerHTML=data.content||'';if(data.cover_image_url){$('#cover-preview').src=data.cover_image_url;$('#cover-preview').classList.remove('hidden');$('#cover-preview').dataset.url=data.cover_image_url}}load();$('#toolbar').addEventListener('mousedown',e=>e.preventDefault());document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{editor.focus();document.execCommand(b.dataset.cmd,false,b.dataset.value||null)});$('#link-btn').onclick=()=>{editor.focus();const u=prompt('Paste the URL:');if(u)document.execCommand('createLink',false,u)};$('#quote-btn').onclick=()=>{editor.focus();document.execCommand('formatBlock',false,'blockquote')};async function uploadImage(file){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${session.user.id}/${crypto.randomUUID()}.${ext}`;const {error}=await supabase.storage.from('article-images').upload(path,file,{contentType:file.type,upsert:false});if(error){show(error.message);return null}return supabase.storage.from('article-images').getPublicUrl(path).data.publicUrl}$('#image-btn').onclick=()=>$('#image-file').click();$('#image-file').onchange=async e=>{const u=await uploadImage(e.target.files[0]);if(u){editor.focus();document.execCommand('insertImage',false,u)}};$('#cover').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#cover-status').textContent='Uploading…';const u=await uploadImage(f);if(u){$('#cover-preview').src=u;$('#cover-preview').classList.remove('hidden');$('#cover-preview').dataset.url=u;$('#cover-status').textContent='Uploaded'}};async function save(status){const author=$('#author_name').value.trim(),title=$('#title').value.trim();if(!author||!title||!editor.innerText.trim())return show('Please enter an author name, title, and body.');const payload={author_id:session.user.id,author_name:author,title,excerpt:$('#excerpt').value.trim(),content:editor.innerHTML,category:$('#category').value.trim(),cover_image_url:$('#cover-preview').dataset.url||null,status,content_type:type(),updated_at:new Date().toISOString()};let r=currentId?await supabase.from('articles').update(payload).eq('id',currentId).eq('author_id',session.user.id):await supabase.from('articles').insert(payload).select('id').single();if(r.error)return show(r.error.message);if(!currentId)currentId=r.data?.id;show(status==='draft'?'Draft saved.':'Submitted for editorial review.',true);if(status==='pending')setTimeout(()=>location.href='/member',700)}$('#draft').onclick=()=>save('draft');$('#form').onsubmit=e=>{e.preventDefault();save('pending')};</script></body></html>
