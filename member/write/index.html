<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write an Article - Economic Policy Lab</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#fbf9f8] text-[#1b1c1c]"><main class="max-w-4xl mx-auto px-5 md:px-12 py-12"><a href="/member" class="text-xs uppercase tracking-[.18em] text-[#af2b3e]">← Member dashboard</a><h1 class="font-serif text-4xl font-bold mt-6">Write an article</h1><p class="text-gray-600 mt-2 mb-8">Submit your work for editorial review.</p><div id="message" class="hidden p-3 border mb-5"></div><form id="form" class="space-y-5 bg-white border p-6 md:p-8"><label class="block text-sm font-semibold">Author name<input id="author_name" required maxlength="120" placeholder="Your name as it should appear on the article" class="mt-1 w-full border p-3 text-base"></label><label class="block text-sm font-semibold">Title<input id="title" required maxlength="240" class="mt-1 w-full border p-3 text-base"></label><label class="block text-sm font-semibold">Abstract / excerpt<textarea id="excerpt" rows="3" class="mt-1 w-full border p-3"></textarea></label><label class="block text-sm font-semibold">Article body<textarea id="content" rows="18" required class="mt-1 w-full border p-3"></textarea></label><label class="block text-sm font-semibold">Category<input id="category" placeholder="e.g. Monetary Policy" class="mt-1 w-full border p-3"></label><div class="flex gap-3"><button type="button" id="draft" class="border border-black px-5 py-3 text-sm font-semibold">Save draft</button><button class="bg-black text-white px-5 py-3 text-sm uppercase tracking-wider">Submit for review</button></div></form></main><script type="module">import {supabase} from '../../supabase-client.js'; const {data:{session}}=await supabase.auth.getSession();if(!session)location.href='/auth/';const form=document.querySelector('#form'),msg=document.querySelector('#message');function show(t,ok=false){msg.textContent=t;msg.className='p-3 border mb-5 '+(ok?'border-green-600 text-green-700 bg-green-50':'border-[#af2b3e] text-[#af2b3e] bg-red-50');}async function save(status){const payload={author_id:session.user.id,author_name:document.querySelector('#author_name').value.trim(),title:document.querySelector('#title').value.trim(),excerpt:document.querySelector('#excerpt').value.trim(),content:document.querySelector('#content').value,category:document.querySelector('#category').value.trim(),status};const {error}=await supabase.from('articles').insert(payload);if(error)return show(error.message);show(status==='draft'?'Draft saved.':'Submitted for editorial review.',true);if(status!=='draft')setTimeout(()=>location.href='/member',700);}document.querySelector('#draft').onclick=()=>save('draft');form.addEventListener('submit',e=>{e.preventDefault();save('pending');});</script></body></html>
